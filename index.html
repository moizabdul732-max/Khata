<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2038">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Khata - Books of Account & Audit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<!-- CONFIG: Google and Firebase web identifiers live in ONE block (KHATA_DEFAULT_CONFIG) at the start of the cloud script near the end of this file. -->
<style>
:root{
  --navy:#0f2038; --navy2:#16304f; --paper:#f8f6f0; --surface:#ffffff; --surface2:#f1ece1;
  --ink:#1c2430; --muted:#6c6255; --line:#dcd5c5; --gold:#a6803d; --good:#2f6b45; --bad:#a13d34;
  --f-head:'Source Serif 4',Georgia,serif; --f-ui:'Inter',system-ui,sans-serif; --f-num:'IBM Plex Mono',Menlo,Consolas,monospace;
  box-sizing:border-box;
}
:root[data-theme="dark"]{ --navy:#0a1220; --navy2:#12203a; --paper:#12130f; --surface:#1a1b15; --surface2:#22231b; --ink:#e9e4d6; --muted:#9b9484; --line:#33342a; --gold:#c99a4e; --good:#5cb37a; --bad:#e08072; }
:root[data-theme="slate"]{ --navy:#1b2733; --navy2:#24384a; --paper:#eef1f4; --surface:#ffffff; --surface2:#e3e8ed; --ink:#1c2733; --muted:#5c6b7a; --line:#c8d0d8; --gold:#3f6f9c; --good:#2f7a4f; --bad:#a13d3d; }
:root[data-theme="forest"]{ --navy:#152317; --navy2:#1e3320; --paper:#eef2e6; --surface:#ffffff; --surface2:#e3ead6; --ink:#1e2b1f; --muted:#5c6b52; --line:#c9d4b3; --gold:#7a8f3f; --good:#2f6d3a; --bad:#a13d3d; }
:root[data-theme="slate-dark"]{ --navy:#4a7ba8; --navy2:#2f4a63; --paper:#0d1420; --surface:#141d2b; --surface2:#1c2735; --ink:#dbe4ec; --muted:#8b9aac; --line:#2a3646; --gold:#5b9bd5; --good:#5cb37a; --bad:#e08072; }
:root[data-theme="forest-dark"]{ --navy:#5f8a3f; --navy2:#31432a; --paper:#0f1710; --surface:#161f18; --surface2:#1e2a20; --ink:#dde8dd; --muted:#8fa088; --line:#2c3a2c; --gold:#8fbf4f; --good:#5cb37a; --bad:#e08072; }
*{margin:0;box-sizing:inherit}
html,body{height:100%}
body{font-family:var(--f-ui);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-head);font-weight:600}
.app{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{width:240px;flex:none;background:var(--navy);color:#eee8da;display:flex;flex-direction:column;
  padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px));position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:6px 10px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px}
.brand .name{font-family:var(--f-head);font-size:21px;font-weight:700;color:#f5f1e4}
.brand .co-sub{font-size:11.5px;color:var(--gold);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .tag{font-size:10.5px;color:#a9a08a;margin-top:2px;letter-spacing:.2px}
.navlist{display:flex;flex-direction:column;gap:3px;flex:1}
.navlist button{text-align:left;background:none;border:none;color:#cdc6b3;padding:9px 12px;border-radius:6px;
  font-family:var(--f-ui);font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .15s ease,color .15s ease,transform .15s ease}
.navlist button .dot{width:6px;height:6px;border-radius:50%;background:transparent;transition:background .15s ease,transform .15s ease}
.navlist button:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px)}
.navlist button.active{background:var(--navy2);color:#fff;font-weight:600}
.navlist button.active .dot{background:var(--gold);transform:scale(1.3)}
.sidebar-foot{font-size:11px;color:#8a8270;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);margin-top:10px;display:flex;flex-direction:column;gap:8px}
.main{flex:1;min-width:0;padding:22px 28px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topbar h2{font-size:22px}
.top-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px;background:var(--surface);padding:4px 8px;border:1px solid var(--line);border-radius:6px}
.ctrl-group label{font-size:10px;color:var(--muted);text-transform:none;letter-spacing:.3px;margin:0;font-weight:600}
.ctrl-group select{border:none;background:var(--surface);color:var(--ink)}
.ctrl-group select option{background:var(--surface);color:var(--ink)}
select,button,input{font-family:var(--f-ui);font-size:13px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:5px;padding:6px 10px}
select option{background:var(--surface);color:var(--ink)}
button{cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .08s ease,color .15s ease,box-shadow .15s ease}
button:active{transform:scale(.96)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.18)}
.btn-primary:active{transform:translateY(0) scale(.97)}
.btn-ghost:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.rowbtn:hover{transform:translateY(-1px)}
.pill-btn{transition:background .15s,color .15s,border-color .15s,transform .08s}
.pill-btn:hover:not(.active){border-color:var(--gold);color:var(--ink)}
.pill-btn:active{transform:scale(.96)}
a{transition:color .15s ease}
tbody tr{transition:background .12s ease}
button:hover{background:var(--surface2)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.btn-primary:hover{background:var(--navy2)}
.btn-ghost{background:none;border:1px solid var(--line)}
.btn-sm{padding:4px 9px;font-size:12px}
.panel{display:none}
.panel.active{display:block;animation:panelIn .22s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.02);transition:box-shadow .18s ease,border-color .18s ease}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.07);border-color:var(--gold)}
.card h3{font-size:15px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.grid{display:grid;gap:10px}
.grid.acc{grid-template-columns:1.5fr 1fr 110px 1fr auto auto}
.grid.yr{grid-template-columns:1fr auto auto}
.grid.set{grid-template-columns:1fr 1fr}
.grid.audit{grid-template-columns:1.5fr 1fr 1fr 1fr auto auto}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:none;letter-spacing:.3px;font-weight:600}
select,input{width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.tb-table th,.tb-table td{padding:12px 14px}
.tb-table tbody tr:not(.unit-row):hover{background:var(--surface2)}
table tbody tr:not(.unit-row):not(.section-row):hover td{background:var(--surface2)}
th.year-col{font-size:14px!important;font-weight:700!important;color:var(--gold)!important;letter-spacing:.3px}
th{font-size:10.5px;text-transform:none;letter-spacing:.4px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-num)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;font-family:var(--f-num)}
tfoot td:first-child{font-family:var(--f-ui)}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.tag.Asset,.tag.Income{color:var(--good);border-color:rgba(47,107,69,.3)} .tag.Liability,.tag.Expense{color:var(--bad);border-color:rgba(161,61,52,.3)}
.small{font-size:11.5px;color:var(--muted)}
.rowbtn{background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer;padding:4px 8px;font-size:12px;border-radius:5px;margin-left:4px;line-height:1}
.rowbtn:hover{color:var(--ink);background:var(--surface2)}
.rowbtn.danger:hover{color:var(--bad);border-color:var(--bad)}
.rowbtn:disabled{opacity:.3;cursor:not-allowed;background:none}
.btn-group{white-space:nowrap}
.empty{color:var(--muted);font-style:italic;padding:14px 0;font-size:13px}
.report-head{text-align:center;margin-bottom:18px}
.report-head .co{font-size:20px;font-family:var(--f-head);font-weight:700;color:var(--ink)}
.report-head .title{font-size:15px;font-family:var(--f-head);font-weight:600;margin-top:2px;color:var(--gold)}
.report-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
.unit-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:4px}
.unit-row td{text-align:center;font-style:italic;color:var(--muted);font-size:11px;background:var(--surface2)!important;font-weight:400!important}
.section-row td{background:var(--surface2);font-weight:700;padding-top:9px;padding-bottom:7px;color:var(--gold);font-size:12.5px;text-transform:none;letter-spacing:.3px}
.subtotal-row td{font-weight:700;border-top:1px solid var(--line);font-family:var(--f-num)}
.subtotal-row td:first-child{font-family:var(--f-ui)}
.code-badge{font-family:var(--f-num);font-size:10.5px;color:var(--gold);background:var(--surface2);padding:1px 6px;border-radius:4px;margin-right:6px}
.err{color:var(--bad);font-size:12px;margin-top:8px;font-weight:500}
.ok{color:var(--good);font-size:12px;margin-top:8px;font-weight:500}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface2);border-radius:7px;padding:10px 16px;min-width:130px;border-left:3px solid var(--gold);flex:1;transition:transform .15s ease,box-shadow .15s ease}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:none;letter-spacing:.3px;font-weight:600}
.stat .v{font-family:var(--f-num);font-size:17px;font-weight:600;margin-top:2px}
.import-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.denom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.denom-cell{background:var(--surface2);border-radius:7px;padding:8px 10px}
.denom-cell label{font-family:var(--f-num);font-size:13px;font-weight:700;color:var(--gold);text-transform:none}
.denom-cell input{margin-top:4px}
.denom-cell .sub{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--f-num)}
.import-row input[type=file]{width:auto;flex:1;min-width:180px;font-size:12px;padding:5px}
.msg{font-size:12px;margin-top:6px}
.searchbar{margin-bottom:12px}
.searchbar input{max-width:260px}
.voucher-block{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.voucher-block .vhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:6px;flex-wrap:wrap;gap:6px}
.voucher-block .vhead .vid{font-family:var(--f-num);color:var(--gold);font-weight:600}
.pill-btn{border:1px solid var(--line);background:var(--surface);padding:4px 10px;font-size:12px;border-radius:20px;cursor:pointer}
.pill-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
select.csel-native{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.csel-wrap{position:relative;display:inline-block}
.csel-btn{display:flex;align-items:center;gap:6px;justify-content:space-between;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-family:var(--f-ui);font-size:13px;min-width:100%;transition:border-color .15s,background .15s}
.csel-btn:hover{border-color:var(--gold)}
.csel-btn .csel-arrow{font-size:10px;color:var(--muted);transition:transform .15s}
.csel-btn.open .csel-arrow{transform:rotate(180deg)}
.csel-list{display:none;position:fixed;min-width:160px;max-height:260px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:9999;padding:4px}
.csel-list.open{display:block}
.csel-item{padding:7px 10px;font-size:13px;border-radius:4px;cursor:pointer;color:var(--ink);white-space:nowrap}
.csel-item:hover{background:var(--surface2)}
.csel-item.active{background:var(--navy);color:#fff}
.ctrl-group .csel-btn{border:none;background:none;padding:2px 4px}
.mode-toggle{display:inline-flex;background:var(--surface2);border-radius:6px;padding:2px;gap:2px}
.mode-btn{border:none;background:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:4px;cursor:pointer;transition:background .15s,color .15s}
.mode-btn:hover{color:var(--ink)}
.mode-btn.active{background:var(--navy);color:#fff}
#singlePrintHolder{display:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:10000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:22px 24px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:modalIn .15s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.modal-msg{font-size:14px;line-height:1.5;margin-bottom:18px;white-space:pre-line}
.modal-btns{display:flex;justify-content:flex-end;gap:8px}
.app-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10001}
.app-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{
  body.printing-single .sidebar, body.printing-single .topbar, body.printing-single #panels{display:none!important}
  body.printing-single #singlePrintHolder{display:block!important}
}
@page{ margin: 12mm 10mm; }
/* ---- account / cloud cards ---- */
.acct-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.acct-meta{min-width:0;flex:1}
.acct-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-mail{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:42px;height:42px;flex:none;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-weight:700;font-size:17px;border:2px solid var(--gold)}
.avatar.off{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.avatar.sm{width:34px;height:34px;font-size:14px;border-width:1.5px}
.avatar.xs{width:26px;height:26px;font-size:12px;border-width:1.5px}
.sync-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sdot.ok{background:var(--good)} .sdot.err{background:var(--bad)} .sdot.busy{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acct-chip{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:rgba(255,255,255,.06);color:#eee8da;border:1px solid rgba(255,255,255,.12);padding:7px 9px;border-radius:8px;font-size:12px}
.acct-chip:hover{background:rgba(255,255,255,.1)}
.acct-chip .avatar{background:rgba(255,255,255,.1);border-color:var(--gold);color:#fff}
.acct-chip-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.acct-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface)}
.acct-item.active{border-color:var(--gold);background:var(--surface2)}
.modal-card.wide{max-width:440px}
.modal-title{font-family:var(--f-head);font-size:17px;font-weight:600;margin-bottom:12px}
#acctOverlay{z-index:9990}

/* ---- mobile chrome (hidden on desktop) ---- */
.mbar,.mnav{display:none}
.mbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#f5f1e4;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));border-bottom:1px solid rgba(255,255,255,.12)}
.mbar .mb-txt{min-width:0}
.mbar .n{font-family:var(--f-head);font-weight:700;font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .s{font-size:11px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar button{flex:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:9px;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center}
.mbar button:hover{background:rgba(255,255,255,.14)}
.mbar svg,.mnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left));justify-content:space-around;gap:2px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.mnav button{flex:1;min-width:0;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:6px 2px;border-radius:9px}
.mnav button:hover{background:none}
.mnav button.active{color:var(--gold);background:var(--surface2)}
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:9000;align-items:flex-end}
.sheet-overlay.open{display:flex}
.sheet{width:100%;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:none;
  padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow-y:auto;animation:sheetIn .2s ease}
@keyframes sheetIn{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet-acct{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);margin-bottom:12px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet-item{display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;line-height:1.25}
.sheet-item.active{border-color:var(--gold);color:var(--gold);background:var(--surface2)}

@media screen and (max-width:850px){
  .app{display:block;min-height:0}
  .sidebar{display:none}
  .mbar{display:flex}
  .mnav{display:flex}
  .main{padding:12px max(14px,env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left))}
  .topbar{flex-direction:column;align-items:stretch;gap:10px;margin-bottom:14px;padding-bottom:10px}
  .topbar h2{font-size:19px}
  .top-controls{flex-wrap:nowrap;overflow-x:auto;gap:8px;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .top-controls::-webkit-scrollbar{display:none}
  .top-controls>*{flex:none;white-space:nowrap}
  .ctrl-group{padding:5px 8px}

/* =====================================================================
   ENCRYPTION AT REST: AES-256-GCM, key derived from the passcode (PBKDF2-SHA256, 250k rounds).
   Stored values look like "enc1:" + base64(salt16 + iv12 + ciphertext). Because the salt travels inside
   each value, cloud sync and Drive backups carry only ciphertext and any device with the same passcode can open them.
   ===================================================================== */
const KCRYPT=(function(){
  const te=new TextEncoder(), td=new TextDecoder(), P='enc1:', ITER=250000, cache=new Map();
  let pin=null, salt=null;
  const b64=u=>{ let s=''; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
  const ub=t=>{ const s=atob(t), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
  const parts=env=>{ const raw=ub(env.slice(P.length)); return {sb:raw.slice(0,16), iv:raw.slice(16,28), ct:raw.slice(28)}; };
  const derive=async(p,sb)=>{ const km=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:sb,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); };
  const getKey=async sb=>{ const id=b64(sb); let k=cache.get(id); if(!k){ k=await derive(pin,sb); cache.set(id,k); } return k; };
  return {
    supported:()=>!!(window.crypto&&crypto.subtle),
    isEnc:v=>typeof v==='string'&&v.startsWith(P),
    active:()=>pin!==null,
    checkPin:p=>p===pin,
    async setup(p){ pin=p; cache.clear(); salt=crypto.getRandomValues(new Uint8Array(16)); await getKey(salt); },
    clear(){ pin=null; salt=null; cache.clear(); },
    async unlock(p,env){ try{ const {sb,iv,ct}=parts(env); const k=await derive(p,sb); await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);
      pin=p; cache.clear(); cache.set(b64(sb),k); salt=sb; return true; }catch(e){ return false; } },
    async encrypt(txt){ const iv=crypto.getRandomValues(new Uint8Array(12)), k=await getKey(salt);
      const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(txt)));

  };

function fmt(n, raw=false){
  if(isNaN(n) || n === null) return '-';
  const scale = parseFloat(pref.amountScale || 1);
  n = n / scale;
  const dec = parseInt(pref.decimals !== undefined ? pref.decimals : 2);
  n = Math.round((n + Number.EPSILON) * Math.pow(10, dec)) / Math.pow(10, dec);
  const neg = n < 0;
  n = Math.abs(n);
  const formattedNum = n.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
  if(raw) return (neg ? '-' : '') + formattedNum;
  return (neg ? '(' : '') + formattedNum + (neg ? ')' : '');
}

function auditClientsForYear(){ return state.auditClients.filter(c=>c.yearId===state.currentYearId); }
const AUDIT_ROLE_LABEL = {exp:'Expense', firm:'Firm Allowance', client:'Client Allowance'};

function auditClientAmounts(cl){
  const legs = state.entries.filter(e=>e.auditClientId===cl.id);
  const sum = role => legs.filter(e=>e.auditRole===role).reduce((s,e)=>s+(e.dr||e.cr||0),0);
  const auto = {exp:sum('exp'), firm:sum('firm'), client:sum('client')};
  const ov = {exp:cl.expOverride, firm:cl.firmOverride, client:cl.clientOverride};
  const isOv = k => ov[k]!==null && ov[k]!==undefined;
  const val = k => isOv(k) ? ov[k] : auto[k];
  return {auto, isOv, exp:val('exp'), firm:val('firm'), client:val('client'), net: val('exp') - (val('firm')+val('client'))};
}

function enhanceSelect(select){
  if(!select) return;
  // header selects are static HTML and get enhanced on every render: unwrap any previous wrapper first so buttons never stack
  if(select.parentNode && select.parentNode.classList && select.parentNode.classList.contains('csel-wrap')){
    const oldWrap = select.parentNode; oldWrap.parentNode.insertBefore(select, oldWrap); oldWrap.remove(); select.classList.remove('csel-native');
  }
  const wrap = document.createElement('span'); wrap.className='csel-wrap';
  select.parentNode.insertBefore(wrap, select);
  wrap.appendChild(select);
  select.classList.add('csel-native');
  const btn = document.createElement('button'); btn.type='button'; btn.className='csel-btn';
  if(select._cselList) select._cselList.remove();
  const list = document.createElement('div'); list.className='csel-list'; list._sel=select; select._cselList=list;
  document.body.appendChild(list); // portal: removed when its select leaves the DOM (see pruneLists)
  const sync = ()=>{
    const opt = select.options[select.selectedIndex];
    btn.textContent=''; const s1=document.createElement('span'); s1.textContent=opt?opt.textContent:''; const s2=document.createElement('span'); s2.className='csel-arrow'; s2.textContent='▾'; btn.append(s1,s2);
    list.querySelectorAll('.csel-item').forEach(it=>it.classList.toggle('active', it.dataset.value===select.value));
  };
  const position = ()=>{
    const r = btn.getBoundingClientRect();
    list.style.left = Math.round(r.left)+'px';
    list.style.top = Math.round(r.bottom+4)+'px';
    list.style.minWidth = Math.round(r.width)+'px';
    if(list.getBoundingClientRect().bottom > window.innerHeight){ list.style.top = Math.round(r.top - list.offsetHeight - 4)+'px'; }
  };
  const closeList = ()=>{ list.classList.remove('open'); btn.classList.remove('open'); };
  [...select.options].forEach(opt=>{
    const item = document.createElement('div'); item.className='csel-item'; item.textContent=opt.textContent; item.dataset.value=opt.value;
    item.onclick = (e)=>{ e.stopPropagation(); select.value = opt.value; select.dispatchEvent(new Event('change',{bubbles:true})); sync(); closeList(); };
    list.appendChild(item);
  });
  btn.onclick = (e)=>{
    e.stopPropagation();
    document.querySelectorAll('.csel-list.open').forEach(l=>{ if(l!==list) l.classList.remove('open'); });
    document.querySelectorAll('.csel-btn.open').forEach(b2=>{ if(b2!==btn) b2.classList.remove('open'); });
    const willOpen = !list.classList.contains('open');
    closeList();
    if(willOpen){ position(); list.classList.add('open'); btn.classList.add('open'); }
  };
  wrap.appendChild(btn);
  sync();
}

/* ---- Themed modal dialogs (replace native confirm()/alert()) ---- */
function showConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    document.getElementById('modalBtns').innerHTML = `<button class="btn-ghost btn-sm" id="modalCancelBtn">Cancel</button><button class="btn-primary btn-sm" id="modalOkBtn">OK</button>`;
    const close = (val)=>{ overlay.classList.remove('open'); document.removeEventListener('keydown', onKey); resolve(val); };
    const onKey = (e)=>{ if(e.key==='Escape') close(false); if(e.key==='Enter') close(true); };
    document.getElementById('modalOkBtn').onclick = ()=>close(true);
    document.getElementById('modalCancelBtn').onclick = ()=>close(false);
    overlay.onclick = (e)=>{ if(e.target===overlay) close(false); };
    document.addEventListener('keydown', onKey);
    overlay.classList.add('open');
    document.getElementById('modalOkBtn').focus();
  });
}
function showAlert(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    document.getElementById('modalBtns').innerHTML = `<button class="btn-primary btn-sm" id="modalOkBtn">OK</button>`;
    const close = ()=>{ overlay.classList.remove('open'); document.removeEventListener('keydown', onKey); resolve(); };
    const onKey = (e)=>{ if(e.key==='Escape'||e.key==='Enter') close(); };
    document.getElementById('modalOkBtn').onclick = close;
    overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
    document.addEventListener('keydown', onKey);
    overlay.classList.add('open');
    document.getElementById('modalOkBtn').focus();
  });
}
function showToast(message){
  let el = document.getElementById('appToast');
  if(!el){ el = document.createElement('div'); el.id='appToast'; el.className='app-toast'; document.body.appendChild(el); }
  el.textContent = message; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

function upsertAccount(data, err){
  if(!data.name){ err('Account name required.'); return false; }
  const dup = state.accounts.find(a=>a.name.toLowerCase()===data.name.toLowerCase() && a.id!==(editAcc&&editAcc.id));
  if(dup){ err('Account already exists.'); return false; }
  if(editAcc){ Object.assign(editAcc, data); } else { state.accounts.push({id:uid(), ...data}); }
  return true;
}

        if(upsertAccount({ name, type, isCash, cf: isCash?null:cf }, ()=>{})){ added++; } else { skipped++; IMP_BAD.push('Row '+(i+2)+': Duplicate account "'+name+'"'); }
      });
      if(!(await showPreview('Import Preview',added+' account(s)',IMP_BAD))){ state=JSON.parse(snap); msg.className='msg err'; msg.textContent='Import cancelled. No changes were made.'; return; }
      save(); renderAll(); msg.className='msg ok'; msg.textContent=`Import finished: ${added} added, ${skipped} skipped/duplicate.`;
    }});
  };

  const wrap = el.querySelector('#accTableWrap');
  if(!state.accounts.length){ wrap.innerHTML=`<p class="empty">${t('noAcc')}</p>`; return; }
  wrap.innerHTML = `<table><thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Cash?</th><th>CF Cat.</th><th class="num">Balance ${getHeaderUnitNote()}</th><th></th></tr></thead>
  <tbody>${state.accounts.map(ac=>{ const b=balanceFor(ac, selIdx());
    return `<tr><td><span class="code-badge">${acctCode(ac)}</span></td><td>${esc(ac.name)}</td><td><span class="tag ${ac.type}">${ac.type}</span></td><td>${ac.isCash?'Yes':'-'}</td><td>${ac.isCash?'-':ac.cf}</td>
    <td class="num">${fmt(b.net)}</td><td class="btn-group"><button class="rowbtn" data-e="${ac.id}" title="Edit">${t('edit')}</button>
    <button class="rowbtn danger" data-d="${ac.id}" title="Delete">${t('delete')}</button></td></tr>`; }).join('')}</tbody></table>`;
  wrap.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ editAcc=accById(b.dataset.e); renderAll(); scrollToPanelTop('panel-accounts'); });
  wrap.querySelectorAll('[data-d]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.d;
    if(state.entries.some(e=>e.accId===id)){ await showAlert('Entries exist for this account. Delete them first.'); return; }
    if(!(await showConfirm('Delete this account?'))) return;
    state.accounts = state.accounts.filter(x=>x.id!==id); save(); renderAll();
  });
}

/* ---------------- Journal Vouchers ---------------- */
function vouchersForYear(idx){
  const legs = entriesIn(idx); const map = new Map();
  legs.forEach(l=>{ if(!map.has(l.voucher)) map.set(l.voucher, {voucher:l.voucher, date:l.date, narration:l.narration, legs:[]}); map.get(l.voucher).legs.push(l); });
  return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date));
}

    selectedVouchers.clear(); save(); renderAll();
  };

  renderVoucherList(el, idx);
}

/* ---------------- Ledgers ---------------- */
function counterparties(leg){
  const others = state.entries.filter(e=>e.voucher===leg.voucher && e.id!==leg.id);
  if(!others.length) return '-';
  if(others.length<=2) return others.map(o=>accById(o.accId)?.name||'-').join(', ');
  return 'Multiple ('+others.length+')';
}
let ledgerFilter='';
function ledgerCardData(a, idx){
  const rows = entriesIn(idx).filter(e=>e.accId===a.id).sort((x,y)=>x.date.localeCompare(y.date));
  const opening = isPL(a) ? 0 : (idx>0 ? calcBalance(a, entriesUpTo(idx-1)).net : 0);
  let running = opening;
  const dataRows = rows.map(e=>{ const delta = normalIsDebit(a.type) ? (e.dr-e.cr) : (e.cr-e.dr); running += delta;
    return {date:e.date, voucher:e.voucher, narration:e.narration||'', against:counterparties(e), dr:e.dr, cr:e.cr, bal:running}; });
  const closing = balanceFor(a, idx).net;
  return {rows:dataRows, opening, closing};
}
function renderLedgers(){
  const el = document.getElementById('panel-ledgers'); const idx = selIdx();
  if(!state.accounts.length){ el.innerHTML=`<div class="card"><p class="empty">${t('noAcc')}</p></div>`; return; }
  el.innerHTML = `<div class="report-head">
    <div class="co">${esc(pref.companyName||'')}</div>
    <div class="title">${t('ledgers')}</div>
    <div class="sub">${shortYearH(state.years[idx]?.name)||''}</div>
    <div class="unit-note" style="font-size:11px;color:var(--muted);font-style:italic;margin-top:4px">${getHeaderUnitNote()}</div>
  </div>
  <div class="searchbar no-print" style="margin-bottom:14px"><input id="ledgerSearch" placeholder="Search by account name or code…" value="${esc(ledgerFilter)}"></div>
  <div id="ledgerCardsWrap"></div>`;

function renderLedgerCards(idx){

/* ---------------- Trial Balance ---------------- */
function cumulativeRetained(uptoIdx){ let s=0; for(let i=0;i<=uptoIdx;i++) s+=plFor(i).net; return s; }
function tbRowsData(idx){
  const priorRetained = idx > 0 ? cumulativeRetained(idx - 1) : 0;
  const rows = [];
  if(Math.abs(priorRetained) > 0.005){
    const openDr = priorRetained<0?Math.abs(priorRetained):0, openCr = priorRetained>0?priorRetained:0;
    rows.push({name:'Retained Earnings (B/F)', code:'', type:'Equity', openDr, openCr, perDr:0, perCr:0, closeDr:openDr, closeCr:openCr});
  }
  state.accounts.forEach(a=>{
    const openNet = isPL(a) ? 0 : (idx>0 ? calcBalance(a, entriesUpTo(idx-1)).net : 0);
    const period = calcBalance(a, entriesIn(idx));
    const closeNet = balanceFor(a, idx).net;
    const openDr = normalIsDebit(a.type)?Math.max(openNet,0):Math.max(-openNet,0);
    const openCr = normalIsDebit(a.type)?Math.max(-openNet,0):Math.max(openNet,0);
    const closeDr = normalIsDebit(a.type)?Math.max(closeNet,0):Math.max(-closeNet,0);
    const closeCr = normalIsDebit(a.type)?Math.max(-closeNet,0):Math.max(closeNet,0);
    if(!openDr && !openCr && !period.dr && !period.cr && !closeDr && !closeCr) return;
    rows.push({name:a.name, code:acctCode(a), type:a.type, openDr, openCr, perDr:period.dr, perCr:period.cr, closeDr, closeCr});
  });
  return rows;
}

        </tbody>
        <tfoot><tr><td colspan="2">${t('total')}</td><td class="num">${fmt(rows.reduce((s,r)=>s+r.openDr,0))}</td><td class="num">${fmt(rows.reduce((s,r)=>s+r.openCr,0))}</td><td class="num">${fmt(rows.reduce((s,r)=>s+r.perDr,0))}</td><td class="num">${fmt(rows.reduce((s,r)=>s+r.perCr,0))}</td><td class="num">${fmt(totDr)}</td><td class="num">${fmt(totCr)}</td></tr></tfoot>

      : [['Code','Account','Opening Dr','Opening Cr','Period Dr','Period Cr','Closing Dr','Closing Cr'],
         ...rows.map(r=>[r.code,r.name,r.openDr?r.openDr.toFixed(2):'',r.openCr?r.openCr.toFixed(2):'',r.perDr?r.perDr.toFixed(2):'',r.perCr?r.perCr.toFixed(2):'',r.closeDr?r.closeDr.toFixed(2):'',r.closeCr?r.closeCr.toFixed(2):''])];

/* ---------------- P&L ---------------- */
function plFor(idx){
  if(idx<0) return {inc:[], exp:[], totInc:0, totExp:0, net:0};
  const inc = state.accounts.filter(a=>a.type==='Income').map(a=>({a,v:balanceFor(a,idx).net}));
  const exp = state.accounts.filter(a=>a.type==='Expense').map(a=>({a,v:balanceFor(a,idx).net}));
  const totInc = inc.reduce((s,x)=>s+x.v,0), totExp = exp.reduce((s,x)=>s+x.v,0);
  return {inc,exp,totInc,totExp,net:totInc-totExp};
}

/* ---------------- Cash Flow ---------------- */
function indirectCF(idx){
  if(idx<0) return {netProfit:0, buckets:{Operating:0,Investing:0,Financing:0}, lines:[], totalCF:0, openCash:0, closeCash:0, actual:0};
  const {net: netProfit} = plFor(idx);
  const buckets={Operating:netProfit,Investing:0,Financing:0}; const lines=[];
  state.accounts.filter(a=>!a.isCash && !isPL(a)).forEach(a=>{
    const opening = idx>0 ? calcBalance(a, entriesUpTo(idx-1)).net : 0;
    const closing = calcBalance(a, entriesUpTo(idx)).net;
    const delta = closing-opening; if(Math.abs(delta)<0.005) return;
    const cashEffect = a.type==='Asset' ? -delta : delta;
    const cat = a.cf || 'Operating';
    buckets[cat]+=cashEffect; lines.push({cat,name:a.name,cashEffect});
  });
  const totalCF = buckets.Operating+buckets.Investing+buckets.Financing;
  const cashAccs = state.accounts.filter(a=>a.isCash);
  const openCash = idx>0 ? cashAccs.reduce((s,a)=>s+calcBalance(a,entriesUpTo(idx-1)).net,0) : 0;
  const closeCash = cashAccs.reduce((s,a)=>s+calcBalance(a,entriesUpTo(idx)).net,0);
  return {netProfit, buckets, lines, totalCF, openCash, closeCash, actual: closeCash-openCash};
}

    }).join('');
    return `<div class="card"><h3><span><span class="code-badge">${acctCode(a)}</span>${esc(a.name)} - Cash Counts</span><span class="small">Ledger balance: ${fmt(ledgerClosing)}</span></h3>

/* ---------------- Lock screen, auto-lock and boot ---------------- */
let APP_READY=false;
function showLockScreen(ctx){
  return new Promise(resolve=>{
    const box=document.getElementById('lockScreen'), inp=box.querySelector('#lockPin'), btn=box.querySelector('#lockBtn'), err=box.querySelector('#lockErr'), hint=box.querySelector('#lockHint');
    const att=()=>{ try{ return JSON.parse(localStorage.getItem(LS_ATT)||'{}')||{}; }catch(e){ return {}; } };
    let timer=null;
    hint.textContent = ctx.hasLocal ? 'Enter Your Passcode To Unlock' : 'This Data Is Encrypted. Enter The Passcode You Set On Your Other Device.';
    if(!KCRYPT.supported()){ err.textContent='Encryption Is Not Available Here. Open The App Over HTTPS.'; btn.disabled=true; inp.disabled=true; }
    const tick=()=>{ const left=Math.ceil(((att().until||0)-Date.now())/1000);
      if(left>0){ btn.disabled=true; inp.disabled=true; err.textContent='Too Many Attempts. Try Again In '+left+'s.'; timer=setTimeout(tick,500); }
      else if(timer){ timer=null; btn.disabled=false; inp.disabled=false; err.textContent=''; } };
    const submit=async()=>{
      const pin=inp.value; if(!pin||btn.disabled) return;
      btn.disabled=true; err.textContent='Checking...';
      if(await KCRYPT.unlock(pin, ctx.probe)){ localStorage.removeItem(LS_ATT); inp.value=''; resolve(); return; }
      const a=att(); a.n=(a.n||0)+1; if(a.n>=5) a.until=Date.now()+Math.min(30*Math.pow(2,a.n-5),900)*1000;
      localStorage.setItem(LS_ATT,JSON.stringify(a)); inp.value=''; btn.disabled=false; err.textContent='Wrong Passcode.'; tick(); if(!inp.disabled) inp.focus();
    };
    btn.onclick=submit;
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } };
    box.querySelector('#lockForgot').onclick=async()=>{
      if(!(await showConfirm('Erase all Khata data stored on this device?\n\nThis cannot be undone. If cloud sync or a Drive backup exists, that copy stays encrypted and still needs the old passcode. You will be signed out on this device.'))) return;
      try{ if(window.firebase && firebase.apps.length) await firebase.auth().signOut(); }catch(e){}
      window.__khataNoSync=true;
      [LS_KEY,LS_PREF,LS_LOCK,LS_LOGO,LS_ATT,'__sync_ts','__synced_ts','__last_uid'].forEach(k=>localStorage.removeItem(k));
      location.reload();
    };
    tick(); setTimeout(()=>{ if(!inp.disabled) inp.focus(); },50);
  });
}
async function lockNow(){ await flushSaves(); location.reload(); }
let _hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(!APP_READY||!KCRYPT.active()) return;
  if(document.hidden){ _hiddenAt=Date.now(); return; }
  const m=parseFloat(pref.autoLockMin)||0;
  if(m>0 && _hiddenAt && Date.now()-_hiddenAt>=m*60000) lockNow();
});
async function bootApp(){
  applyTheme();
  try{
    const rawState=localStorage.getItem(LS_KEY), rawPref=localStorage.getItem(LS_PREF), rawLogo=localStorage.getItem(LS_LOGO), verifier=localStorage.getItem(LS_LOCK);
    if(KCRYPT.isEnc(rawState)||KCRYPT.isEnc(rawPref)||KCRYPT.isEnc(rawLogo)||verifier){
      const probe=[rawState,rawPref,rawLogo,verifier].find(v=>KCRYPT.isEnc(v));
      await showLockScreen({probe, hasLocal:!!verifier});
    }
    const stateStr=await readSecure(LS_KEY);
    let prefStr=null, synced={};
    try{ prefStr=await readSecure(LS_PREF); synced=prefStr?(JSON.parse(prefStr)||{}):{}; }catch(e){ console.error('Settings could not be read',e); }
    try{ LOGO_CACHE=(await readSecure(LS_LOGO))||''; }catch(e){ LOGO_CACHE=''; }
    let parsed=null; try{ parsed=stateStr?JSON.parse(stateStr):null; }catch(e){ parsed=null; }
    initState(parsed);
    pref=Object.assign({}, defaultPref, synced, _lsJSON(LS_DEV));
    _lastPrefStr=prefStr;
    if(KCRYPT.active()){
      localStorage.setItem(LS_LOCK, await KCRYPT.encrypt('khata-ok'));
      const plain=[rawState,rawPref,rawLogo].some(v=>v!=null&&!KCRYPT.isEnc(v));
      if(plain){ save(); _lastPrefStr=null; savePref(); if(LOGO_CACHE) writeSecure(LS_LOGO,LOGO_CACHE); }  // plaintext arrived from a restore or sync: encrypt it again
    }
    APP_READY=true; document.body.classList.remove('locked'); renderAll();
  }catch(e){
    console.error(e);
    const err=document.getElementById('lockErr'); if(err) err.textContent='Could Not Open Data: '+e.message;
  }
}
bootApp();

/* ---- CONFIG: edit here. These are PUBLIC web identifiers (not passwords); every Firebase web app ships them.
   Real protection comes from (1) Firestore rules: users/{uid} readable and writable only by that uid, and
   (2) restricting the API key to your website address in Google Cloud Console. Optional override: define
   window.KHATA_CONFIG = {googleClientId:'...', firebase:{...}} before this script. ---- */
const KHATA_DEFAULT_CONFIG = {

const jparse = (t, d) => { try { return JSON.parse(t); } catch (e) { return d; } };

window.refreshAcctLabels = function () {
  const u = CLOUD.user;
  const label = u ? (u.email || u.displayName) : 'Sign In';
  const ini = u ? (u.displayName || u.email || '?').trim().charAt(0).toUpperCase() : 'G';
  document.querySelectorAll('.js-acct-label').forEach(e => e.textContent = label);
  document.querySelectorAll('.js-acct-avatar').forEach(e => e.textContent = ini);
};

/* ---- Settings cards ---- */
window.renderCloudUI = function () {
  window.refreshAcctLabels();
  const host = document.getElementById('cloudCards'); if (!host) return;
  const u = CLOUD.user, saved = getSaved();
  const ini = u ? (u.displayName || u.email || '?').trim().charAt(0).toUpperCase() : 'G';
  const choose = localStorage.getItem('__gd_choose') === '1';
  host.innerHTML = `
    <div class="card">
      <h3>Google Account &amp; Sync</h3>
      <div class="acct-row">
        <div class="avatar ${u ? '' : 'off'}">${esc(ini)}</div>
        <div class="acct-meta">
          <div class="acct-name">${u ? esc(u.displayName || u.email) : 'Not Connected'}</div>
          ${u && u.displayName ? `<div class="small acct-mail">${esc(u.email)}</div>` : ''}
          ${CLOUD.syncText ? `<div class="sync-line"><span class="sdot ${CLOUD.syncState}"></span>${esc(CLOUD.syncText)}</div>` : ''}
        </div>
      </div>
      <p class="small" style="margin:10px 0 12px">${u ? 'Your books belong to this Google account. They save automatically, keep working offline, and are removed from this device when you sign out. They stay safe in your account and load again when you sign in.' : 'Guest mode: data stays on this device only. Sign in to save it to your account and use it on other devices.'}</p>
      <div class="btn-row">
        ${u ? `<button class="btn-primary" id="cManage">Manage Accounts</button><button class="btn-ghost" id="cOut">Sign Out</button>`
            : `<button class="btn-primary" id="cIn">Sign In With Google</button>${saved.length ? `<button class="btn-ghost" id="cManage">Manage Accounts</button>` : ''}`}
      </div>
    </div>
    <div class="card">
      <h3>Google Drive Backup</h3>
      ${CLOUD.gdText ? `<p class="small" style="margin-bottom:12px">${esc(CLOUD.gdText)}</p>` : ''}
      <div class="btn-row">
        <button class="btn-primary" id="cBk" ${CLOUD.gdBusy ? 'disabled' : ''}>Backup</button>
        <button class="btn-ghost" id="cRs" ${CLOUD.gdBusy ? 'disabled' : ''}>Restore</button>
        <button class="pill-btn ${choose ? 'active' : ''}" id="cChoose" type="button">Ask Account Each Time</button>
      </div>
    </div>`;
  const $ = id => host.querySelector(id);
  if ($('#cIn')) $('#cIn').onclick = () => window.syncLogin();
  if ($('#cOut')) $('#cOut').onclick = () => window.syncLogout();
  if ($('#cManage')) $('#cManage').onclick = () => window.openAcctModal();
  $('#cBk').onclick = () => window.gdBackup();
  $('#cRs').onclick = () => window.gdRestore();
  $('#cChoose').onclick = () => { localStorage.setItem('__gd_choose', choose ? '0' : '1'); window.renderCloudUI(); };
};
window.updateBanner = function () {
  const b = document.getElementById('syncBanner'); if (!b) return;
  const offline = navigator.onLine === false;
  let html = '', warn = false;
  if (window.__cloudOff || !CLOUD.ready) html = '';
  else if (!CLOUD.user) {
    let dismissed = false; try { dismissed = !!sessionStorage.getItem('__guest_dismiss'); } catch (e) {}
    if (!dismissed) html = '<span><b>Guest Mode:</b> Nothing here is saved to an account. Sign in with Google to keep your data safe and synced.</span><span class="sb-btns"><button class="btn-primary btn-sm" id="sbIn" type="button">Sign In</button><button class="btn-ghost btn-sm" id="sbX" type="button" aria-label="Dismiss">Dismiss</button></span>';
  } else if (offline) html = '<span><b>You Are Offline:</b> Changes are saved on this device and will sync to your account automatically when you are back online.</span>';
  else if (CLOUD.syncState === 'err') { warn = true; html = '<span><b>Sync Problem:</b> ' + esc(CLOUD.syncText) + '. Retrying automatically.</span>'; }
  b.className = 'sync-banner no-print' + (warn ? ' warn' : ''); b.style.display = html ? 'flex' : 'none'; b.innerHTML = html;
  const i = b.querySelector('#sbIn'); if (i) i.onclick = () => window.syncLogin();
  const x = b.querySelector('#sbX'); if (x) x.onclick = () => { try { sessionStorage.setItem('__guest_dismiss', '1'); } catch (e) {} window.updateBanner(); };
};
function refreshCloud() { window.renderCloudUI(); window.updateBanner(); if (document.getElementById('acctOverlay')?.classList.contains('open')) renderAcctModal(); }

/* ---- Manage Accounts modal (same theme as the app's dialogs) ---- */
function acctOverlay() {
  let ov = document.getElementById('acctOverlay');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'acctOverlay'; ov.className = 'modal-overlay no-print';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = '<div class="modal-card wide"><div class="modal-title">Manage Accounts</div><div id="acctBody"></div></div>';
    ov.onclick = e => { if (e.target === ov) ov.classList.remove('open'); };
    document.body.appendChild(ov);
  }
  return ov;
}
function renderAcctModal() {
  const body = document.getElementById('acctBody'); if (!body) return;
  const cur = CLOUD.user, saved = getSaved();
  const list = cur && !saved.some(a => a.uid === cur.uid) ? [{ uid: cur.uid, email: cur.email, name: cur.displayName }, ...saved] : saved;
  body.innerHTML = `
    ${list.length ? list.map(a => {
      const active = cur && cur.uid === a.uid;
      const ini = (a.name || a.email || '?').trim().charAt(0).toUpperCase();
      return `<div class="acct-item ${active ? 'active' : ''}">
        <div class="avatar sm">${esc(ini)}</div>
        <div class="acct-meta"><div class="acct-name">${esc(a.name || a.email)}</div>${a.name ? `<div class="small acct-mail">${esc(a.email)}</div>` : ''}</div>
        ${active ? `<span class="tag" style="color:var(--gold);border-color:var(--gold)">Active</span>`
                 : `<button class="btn-ghost btn-sm" data-sw="${esc(a.email)}">Switch</button><button class="rowbtn danger" data-rm="${esc(a.uid)}" title="Remove from this list">✕</button>`}
      </div>`;
    }).join('') : `<p class="empty">No Account Added Yet.</p>`}
    <div class="modal-btns" style="justify-content:space-between;margin-top:14px">
      <button class="btn-ghost btn-sm" id="acAdd">+ Add Account</button>
      <span style="display:flex;gap:8px">
        ${cur ? `<button class="btn-ghost btn-sm" id="acOut">Sign Out</button>` : ''}
        <button class="btn-primary btn-sm" id="acDone">Done</button>
      </span>
    </div>`;
  body.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => window.syncSwitch(b.dataset.sw));
  body.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { setSaved(getSaved().filter(a => a.uid !== b.dataset.rm)); refreshCloud(); });
  body.querySelector('#acAdd').onclick = () => window.syncSwitch('');
  const out = body.querySelector('#acOut'); if (out) out.onclick = async () => { await window.syncLogout(); };
  body.querySelector('#acDone').onclick = () => acctOverlay().classList.remove('open');
}
window.openAcctModal = function () { const ov = acctOverlay(); renderAcctModal(); ov.classList.add('open'); };
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.js-acct')) { const s = document.getElementById('moreSheet'); if (s) s.classList.remove('open'); window.openAcctModal(); } });

/* ============ 1) GOOGLE DRIVE BACKUP / RESTORE ============ */
(function () {
  const CLIENT_ID = KHATA_CFG.googleClientId;
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  const FILE = 'khata-backup.json';
  const setLS = Storage.prototype.setItem;
  const last = localStorage.getItem('__gd_last');
  if (last) CLOUD.gdText = 'Last backup: ' + last;

  function getToken() {
    return new Promise((res, rej) => {
      if (/^YOUR_/.test(CLIENT_ID)) return rej(new Error('Google client ID is missing in the config block.'));
      if (!window.google || !google.accounts) return rej(new Error('Google sign-in script did not load. Check your internet connection.'));
      const opts = {};
      if (localStorage.getItem('__gd_choose') === '1') opts.prompt = 'select_account';
      else if (CLOUD.user && CLOUD.user.email) opts.hint = CLOUD.user.email;
      google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPE,
        callback: r => r.error ? rej(new Error(r.error)) : res(r.access_token),
        error_callback: e => rej(new Error(e.type || 'popup_closed'))
      }).requestAccessToken(opts);
    });
  }
  async function findFile(token) {
    const q = encodeURIComponent("name='" + FILE + "'");
    const r = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q=' + q, { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('Drive error ' + r.status);
    return (await r.json()).files[0];
  }
  const cancelled = e => /popup_closed|popup_failed|access_denied/.test(e.message);
  const busy = (b, txt) => { CLOUD.gdBusy = b; if (txt !== undefined) CLOUD.gdText = txt; refreshCloud(); };
  const idleText = () => { const l = localStorage.getItem('__gd_last'); return l ? 'Last backup: ' + l : ''; };

  window.gdBackup = async function () {
    if (CLOUD.gdBusy) return;
    try {
      busy(true, 'Backing Up...');
      const token = await getToken();
      await flushSaves();
      const data = {};
      SYNC_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) data[k] = v; });
      const existing = await findFile(token);
      const meta = existing ? {} : { name: FILE, parents: ['appDataFolder'] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
      form.append('file', new Blob([JSON.stringify(data)], { type: 'application/json' }));
      const url = existing
        ? 'https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart'
        : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      const r = await fetch(url, { method: existing ? 'PATCH' : 'POST', headers: { Authorization: 'Bearer ' + token }, body: form });
      if (!r.ok) throw new Error('Upload Failed ' + r.status);
      const t = new Date().toLocaleString();
      setLS.call(localStorage, '__gd_last', t);
      busy(false, 'Last backup: ' + t);
      showToast('Backup Complete');
    } catch (e) {
      busy(false, idleText());
      if (!cancelled(e)) await showAlert('Backup Failed: ' + e.message);
    }
  };

  window.gdRestore = async function () {
    if (CLOUD.gdBusy) return;
    try {
      busy(true, 'Checking Backup...');
      const token = await getToken();
      const f = await findFile(token);
      busy(false, idleText());
      if (!f) { await showAlert('No Backup Was Found In Google Drive.'); return; }
      if (!(await showConfirm('Restore will replace the current data with the backup data. Continue?'))) return;
      busy(true, 'Restoring...');
      const r = await fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media', { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error('Download Failed ' + r.status);
      const obj = await r.json();
      SYNC_KEYS.forEach(k => { if (k in obj) localStorage.setItem(k, obj[k]); });
      await showAlert('Restore complete. The app will reload.');
      location.reload();
    } catch (e) {
      busy(false, idleText());
      if (!cancelled(e)) await showAlert('Restore Failed: ' + e.message);
    }
  };
})();

/* ============ 2) FIREBASE LIVE SYNC ============ */
(function () {
  const FB = KHATA_CFG.firebase;
  if (!window.firebase || !FB || /^YOUR_/.test(FB.apiKey || '')) {
    window.__cloudOff = true;   // offline / script blocked: app still works locally
    const noCfg = !FB || /^YOUR_/.test((FB && FB.apiKey) || '');
    const off = async () => { await showAlert(noCfg ? 'Cloud sync is not configured. config.js is missing or its keys are empty. Upload config.js next to index.html and reload.' : 'Cloud sync could not start. Check your internet connection and reload the app.'); };
    window.syncLogin = off; window.syncSwitch = off; window.syncLogout = off;
    return;
  }
  firebase.initializeApp(FB);

  const auth = firebase.auth(), db = firebase.firestore();
  const PREF_KEY = 'khata_pref_v6';
  // Everything that belongs to the signed-in account on this device. All of it is removed on sign out.
  const OWNED = ['khata_v5', 'khata_pref_v6', 'khata_logo_v1', 'khata_lock_v1', 'khata_att_v1', '__sync_ts', '__synced_ts', '__last_uid', '__gd_last'];
  const skip = k => !SYNC_KEYS.includes(k);
  const setStatus = (text, state) => {
    text = text || ''; state = state || '';
    if (CLOUD.syncText === text && CLOUD.syncState === state) return;
    CLOUD.syncText = text; CLOUD.syncState = state; refreshCloud();
  };
  const origSet = Storage.prototype.setItem, origRem = Storage.prototype.removeItem;
  let applying = false, timer = null, unsub = null, switching = false;
  const OFFLINE_TEXT = 'Offline: Changes Are Saved On This Device And Will Sync Automatically';
  const online = () => navigator.onLine !== false;
  const snapshot = () => { const o = {}; SYNC_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) o[k] = v; }); return o; };
  const localTs = () => Number(localStorage.getItem('__sync_ts') || 0);
  const syncedTs = () => Number(localStorage.getItem('__synced_ts') || 0);
  const unsynced = () => localTs() > syncedTs();
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

  // true when this device holds real books (not just an empty starter file)
  function localHasData() {
    const raw = localStorage.getItem('khata_v5'); if (!raw) return false;
    if (raw.startsWith('enc1:')) return true;
    const o = jparse(raw, null); if (!o) return false;
    return !!((o.accounts && o.accounts.length) || (o.entries && o.entries.length) || (o.auditClients && o.auditClients.length) ||
              (o.cashRecon && o.cashRecon.length) || (o.cashCounts && o.cashCounts.length) || (o.years && o.years.length > 1));
  }

  function touch(k) {
    if (applying || window.__khataNoSync || skip(k)) return;
    origSet.call(localStorage, '__sync_ts', String(Date.now()));
    clearTimeout(timer);
    if (auth.currentUser) setStatus(online() ? 'Saving...' : OFFLINE_TEXT, 'busy');
    timer = setTimeout(push, 1500);
  }
  Storage.prototype.setItem = function (k, v) { origSet.call(this, k, v); if (this === localStorage) touch(k); };
  Storage.prototype.removeItem = function (k) { origRem.call(this, k); if (this === localStorage) touch(k); };

  async function push() {
    const u = auth.currentUser; if (!u) return false;
    await flushSaves();
    if (!localTs()) origSet.call(localStorage, '__sync_ts', String(Date.now()));
    if (!online()) { setStatus(OFFLINE_TEXT, 'busy'); return false; }   // never hand a write to the network when there is none
    setStatus('Saving...', 'busy');
    const ts = localTs();                                              // edits made while this upload runs keep the device marked as unsynced
    try {
      await withTimeout(db.doc('users/' + u.uid).set({ data: JSON.stringify(snapshot()), ts }), 20000);
      origSet.call(localStorage, '__synced_ts', String(ts));
      origSet.call(localStorage, '__last_uid', u.uid);
      setStatus('Synced', 'ok');
      return true;
    } catch (e) {
      setStatus(e.message === 'timeout' ? 'Connection Is Slow Or Offline. Will Retry Automatically' : 'Sync Error: ' + e.message, e.message === 'timeout' ? 'busy' : 'err');
      return false;
    }
  }

  // Offline edits go up by themselves as soon as the connection is back (and every 20s while anything is pending).
  function retry() { if (auth.currentUser && !switching && online() && unsynced()) push(); }
  window.addEventListener('online', () => { refreshCloud(); setTimeout(retry, 800); });
  window.addEventListener('offline', () => { if (auth.currentUser) setStatus(OFFLINE_TEXT, 'busy'); refreshCloud(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) retry(); });
  setInterval(retry, 20000);

  function applyRemote(remote, force) {
    const obj = remote.data ? jparse(remote.data, {}) : {};
    applying = true;
    SYNC_KEYS.forEach(k => {
      if (k in obj) origSet.call(localStorage, k, obj[k]);
      else if (force || k !== PREF_KEY) origRem.call(localStorage, k);   // older cloud copies have no settings: keep this device's
    });
    const keptPrefs = !(PREF_KEY in obj) && !force && localStorage.getItem(PREF_KEY);
    origSet.call(localStorage, '__sync_ts', String(keptPrefs ? Date.now() : remote.ts));   // newer ts => settings get pushed after reload
    origSet.call(localStorage, '__synced_ts', String(remote.ts));
    if (auth.currentUser) origSet.call(localStorage, '__last_uid', auth.currentUser.uid);
    applying = false;
    location.reload();
  }

  // Remove this account's data from the device, sign out, and come back as an empty guest.
  async function wipeAndReload(doSignOut) {
    clearTimeout(timer); applying = true; window.__khataNoSync = true;
    if (unsub) { unsub(); unsub = null; }
    if (doSignOut) { try { await auth.signOut(); } catch (e) {} }
    OWNED.forEach(k => origRem.call(localStorage, k));
    location.reload();
  }

  // The signed-in account is not the one that owns the data on this device (or the device data is guest data).
  async function handleSwitched(u, s) {
    if (switching) return; switching = true;
    const prev = localStorage.getItem('__last_uid');   // null = guest data
    const hasData = localHasData();
    if (s.exists) {
      // The account already has data in the cloud: the account wins.
      if (hasData && (prev === null || unsynced())) {
        if (!(await showConfirm('This device has data that is not saved to any account. Signing in will replace it with the data from ' + (u.email || 'this account') + '. Continue?'))) {
          switching = false; if (unsub) { unsub(); unsub = null; } await auth.signOut(); return;
        }
      }
      return applyRemote(s.data(), true);
    }
    if (prev === null) {                                // brand-new account: it adopts what is on this device
      origSet.call(localStorage, '__last_uid', u.uid);
      switching = false; showToast('Your data is now saved to your account'); return push();
    }
    applying = true;                                    // brand-new account that replaces another account's data: start empty
    SYNC_KEYS.forEach(k => origRem.call(localStorage, k));
    origRem.call(localStorage, '__sync_ts'); origRem.call(localStorage, '__synced_ts');
    origSet.call(localStorage, '__last_uid', u.uid);
    applying = false;
    location.reload();
  }

  function listen(u) {
    if (unsub) unsub();
    unsub = db.doc('users/' + u.uid).onSnapshot(async s => {
      if (s.metadata.hasPendingWrites) return;
      if (s.metadata.fromCache) { if (!online()) setStatus(OFFLINE_TEXT, 'busy'); return; }   // never act on anything the server has not confirmed
      if (localStorage.getItem('__last_uid') !== u.uid) return handleSwitched(u, s);
      if (!s.exists) return push();
      const remote = s.data();
      const robj = remote.data ? jparse(remote.data, {}) : {};
      if (remote.ts > localTs()) {
        if (unsynced() && remote.ts > syncedTs()) {     // edited here while offline AND changed elsewhere
          if (switching) return; switching = true;
          const keepMine = await showConfirm('Changes were made on this device while offline, and also on another device.\n\nOK keeps this device\'s changes (the other device\'s newer changes are replaced).\nCancel loads the account data (this device\'s offline changes are discarded).');
          switching = false;
          if (keepMine) { origSet.call(localStorage, '__sync_ts', String(Math.max(Date.now(), remote.ts + 1))); return push(); }
        }
        applyRemote(remote);
      }
      else if (remote.ts < localTs()) push();
      else if (!(PREF_KEY in robj) && localStorage.getItem(PREF_KEY)) push();
      else setStatus('Synced', 'ok');
    }, e => setStatus('Sync Error: ' + e.message, 'err'));
  }

  auth.onAuthStateChanged(u => {
    CLOUD.user = u; CLOUD.ready = true;
    if (u) { rememberAccount(u); setStatus(online() ? 'Connecting...' : OFFLINE_TEXT, 'busy'); listen(u); }
    else { if (unsub) { unsub(); unsub = null; } setStatus('', ''); }
    refreshCloud();
  });

  const provider = email => {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters(Object.assign({ prompt: 'select_account' }, email ? { login_hint: email } : {}));
    return p;
  };
  const loginError = e => {
    const c = e.code || '';
    if (c === 'auth/unauthorized-domain') return 'This website address is not authorised for sign-in. Add it in Firebase Console: Authentication, Settings, Authorized Domains.';
    if (c === 'auth/network-request-failed') return 'No internet connection. Connect and try again.';
    if (c === 'auth/operation-not-allowed') return 'Google sign-in is not enabled. Firebase Console: Authentication, Sign-in method, enable Google.';
    if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return 'The Firebase API key is wrong or restricted. Check config.js and the key restrictions in Google Cloud Console.';
    if (c === 'auth/web-storage-unsupported') return 'Browser storage is blocked (private mode or cookies disabled). Allow site data and try again.';
    if (c === 'auth/popup-blocked') return 'The sign-in popup was blocked. Allow popups for this site and try again.';
    if (c === 'auth/too-many-requests') return 'Too many attempts. Wait a few minutes and try again.';
    if (c === 'auth/internal-error') return 'Google sign-in failed internally. Check that the site is opened over https and that this domain is authorised in Firebase.';
    return (c ? c + ': ' : '') + e.message;
  };
  window.syncLogin = async function (email) {
    if (!online()) { await showAlert('You are offline. Connect to the internet to sign in. Your data on this device keeps working.'); return; }
    if (!/^https:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) { await showAlert('Google sign-in needs the app opened from its https web address (not as a local file).'); return; }
    try { await auth.signInWithPopup(provider(email)); }
    catch (e) {
      const c = e.code || '';
      if (/popup-closed|cancelled-popup/.test(c)) return;
      if (c === 'auth/popup-blocked' || c === 'auth/operation-not-supported-in-this-environment') { try { await auth.signInWithRedirect(provider(email)); return; } catch (e2) { e = e2; } }
      await showAlert('Sign In Failed: ' + loginError(e));
    }
  };
  window.syncSwitch = async function (email) {
    if (auth.currentUser) {
      if (!(await showConfirm('Switching accounts replaces the data on this device with the new account\'s data. The current account\'s data stays safe in its cloud. Continue?'))) return;
      clearTimeout(timer);
      if (!(await push())) { await showAlert('Your latest changes have not synced yet, so the account cannot be switched. Check your internet connection and try again.'); return; }
    }
    await window.syncLogin(email);
  };
  window.syncLogout = async function () {
    if (!auth.currentUser) return;
    clearTimeout(timer);
    if (unsynced()) showToast('Syncing Before Sign Out...');
    const pushed = await push();
    const pending = !pushed && unsynced();
    const msg = pending
      ? 'Some recent changes have not reached your account yet (you may be offline). If you sign out now, those changes will be lost.\n\nSign out and remove the data from this device anyway?'
      : 'Sign out? The data on this device will be removed. It stays safe in your Google account and loads again when you sign in.';
    if (!(await showConfirm(msg))) { if (unsynced()) retry(); return; }
    acctOverlay().classList.remove('open');
    await wipeAndReload(true);
  };
})();

window.updateBanner();

window.renderCloudUI();
</script>
