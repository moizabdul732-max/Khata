<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khata — Books of Account & Audit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --navy:#0f2038; --navy2:#16304f; --paper:#f8f6f0; --surface:#ffffff; --surface2:#f1ece1;
  --ink:#1c2430; --muted:#6c6255; --line:#dcd5c5; --gold:#a6803d; --good:#2f6b45; --bad:#a13d34;
  --f-head:'Source Serif 4',Georgia,serif; --f-ui:'Inter',system-ui,sans-serif; --f-num:'IBM Plex Mono',Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{ --navy:#0a1220; --navy2:#12203a; --paper:#12130f; --surface:#1a1b15; --surface2:#22231b; --ink:#e9e4d6; --muted:#9b9484; --line:#33342a; --gold:#c99a4e; --good:#5cb37a; --bad:#e08072; }
:root[data-theme="slate"]{ --navy:#1b2733; --navy2:#24384a; --paper:#eef1f4; --surface:#ffffff; --surface2:#e3e8ed; --ink:#1c2733; --muted:#5c6b7a; --line:#c8d0d8; --gold:#3f6f9c; --good:#2f7a4f; --bad:#a13d3d; }
:root[data-theme="forest"]{ --navy:#152317; --navy2:#1e3320; --paper:#eef2e6; --surface:#ffffff; --surface2:#e3ead6; --ink:#1e2b1f; --muted:#5c6b52; --line:#c9d4b3; --gold:#7a8f3f; --good:#2f6d3a; --bad:#a13d3d; }
:root[data-theme="slate-dark"]{ --navy:#4a7ba8; --navy2:#2f4a63; --paper:#0d1420; --surface:#141d2b; --surface2:#1c2735; --ink:#dbe4ec; --muted:#8b9aac; --line:#2a3646; --gold:#5b9bd5; --good:#5cb37a; --bad:#e08072; }
:root[data-theme="forest-dark"]{ --navy:#5f8a3f; --navy2:#31432a; --paper:#0f1710; --surface:#161f18; --surface2:#1e2a20; --ink:#dde8dd; --muted:#8fa088; --line:#2c3a2c; --gold:#8fbf4f; --good:#5cb37a; --bad:#e08072; }
*{margin:0;box-sizing:inherit}
html,body{height:100%}
body{font-family:var(--f-ui);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-head);font-weight:600}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex:none;background:var(--navy);color:#eee8da;display:flex;flex-direction:column;
  padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px));position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:6px 10px 14px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:14px}
.brand .name{font-family:var(--f-head);font-size:21px;font-weight:700;color:#f5f1e4}
.brand .co-sub{font-size:11.5px;color:var(--gold);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .tag{font-size:10.5px;color:#a9a08a;margin-top:2px;letter-spacing:.2px}
.navlist{display:flex;flex-direction:column;gap:3px;flex:1}
.navlist button{text-align:left;background:none;border:none;color:#cdc6b3;padding:9px 12px;border-radius:6px;
  font-family:var(--f-ui);font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .15s ease,color .15s ease,transform .15s ease}
.navlist button .dot{width:6px;height:6px;border-radius:50%;background:transparent;transition:background .15s ease,transform .15s ease}
.navlist button:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px)}
.navlist button.active{background:var(--navy2);color:#fff;font-weight:600}
.navlist button.active .dot{background:var(--gold);transform:scale(1.3)}
.sidebar-foot{font-size:11px;color:#8a8270;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);margin-top:10px;display:flex;flex-direction:column;gap:8px}
.main{flex:1;min-width:0;padding:22px 28px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topbar h2{font-size:22px}
.top-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrl-group{display:flex;align-items:center;gap:6px;background:var(--surface);padding:4px 8px;border:1px solid var(--line);border-radius:6px}
.ctrl-group label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:0;font-weight:600}
.ctrl-group select{border:none;background:var(--surface);color:var(--ink)}
.ctrl-group select option{background:var(--surface);color:var(--ink)}
select,button,input{font-family:var(--f-ui);font-size:13px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:5px;padding:6px 10px}
select option{background:var(--surface);color:var(--ink)}
button{cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .08s ease,color .15s ease,box-shadow .15s ease}
button:active{transform:scale(.96)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.18)}
.btn-primary:active{transform:translateY(0) scale(.97)}
.btn-ghost:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.rowbtn:hover{transform:translateY(-1px)}
.pill-btn{transition:background .15s,color .15s,border-color .15s,transform .08s}
.pill-btn:hover:not(.active){border-color:var(--gold);color:var(--ink)}
.pill-btn:active{transform:scale(.96)}
a{transition:color .15s ease}
tbody tr{transition:background .12s ease}
button:hover{background:var(--surface2)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.btn-primary:hover{background:var(--navy2)}
.btn-ghost{background:none;border:1px solid var(--line)}
.btn-sm{padding:4px 9px;font-size:12px}
.panel{display:none}
.panel.active{display:block;animation:panelIn .22s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.02);transition:box-shadow .18s ease,border-color .18s ease}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.07);border-color:var(--gold)}
.card h3{font-size:15px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.grid{display:grid;gap:10px}
.grid.acc{grid-template-columns:1.5fr 1fr 110px 1fr auto auto}
.grid.yr{grid-template-columns:1fr auto auto}
.grid.set{grid-template-columns:1fr 1fr}
.grid.audit{grid-template-columns:1.5fr 1fr 1fr 1fr auto auto}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
select,input{width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.tb-table th,.tb-table td{padding:12px 14px}
.tb-table tbody tr:not(.unit-row):hover{background:var(--surface2)}
table tbody tr:not(.unit-row):not(.section-row):hover td{background:var(--surface2)}
th.year-col{font-size:14px!important;font-weight:700!important;color:var(--gold)!important;letter-spacing:.3px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-num)}
tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none;font-family:var(--f-num)}
tfoot td:first-child{font-family:var(--f-ui)}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-weight:500}
.tag.Asset,.tag.Income{color:var(--good);border-color:rgba(47,107,69,.3)} .tag.Liability,.tag.Expense{color:var(--bad);border-color:rgba(161,61,52,.3)}
.small{font-size:11.5px;color:var(--muted)}
.rowbtn{background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer;padding:4px 8px;font-size:12px;border-radius:5px;margin-left:4px;line-height:1}
.rowbtn:hover{color:var(--ink);background:var(--surface2)}
.rowbtn.danger:hover{color:var(--bad);border-color:var(--bad)}
.rowbtn:disabled{opacity:.3;cursor:not-allowed;background:none}
.btn-group{white-space:nowrap}
.empty{color:var(--muted);font-style:italic;padding:14px 0;font-size:13px}
.report-head{text-align:center;margin-bottom:18px}
.report-head .co{font-size:20px;font-family:var(--f-head);font-weight:700;color:var(--ink)}
.report-head .title{font-size:15px;font-family:var(--f-head);font-weight:600;margin-top:2px;color:var(--gold)}
.report-head .sub{font-size:12px;color:var(--muted);margin-top:2px}
.unit-note{font-size:11px;color:var(--muted);font-style:italic;margin-top:4px}
.unit-row td{text-align:center;font-style:italic;color:var(--muted);font-size:11px;background:var(--surface2)!important;font-weight:400!important}
.section-row td{background:var(--surface2);font-weight:700;padding-top:9px;padding-bottom:7px;color:var(--gold);font-size:12.5px;text-transform:uppercase;letter-spacing:.3px}
.subtotal-row td{font-weight:700;border-top:1px solid var(--line);font-family:var(--f-num)}
.subtotal-row td:first-child{font-family:var(--f-ui)}
.code-badge{font-family:var(--f-num);font-size:10.5px;color:var(--gold);background:var(--surface2);padding:1px 6px;border-radius:4px;margin-right:6px}
.err{color:var(--bad);font-size:12px;margin-top:8px;font-weight:500}
.ok{color:var(--good);font-size:12px;margin-top:8px;font-weight:500}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface2);border-radius:7px;padding:10px 16px;min-width:130px;border-left:3px solid var(--gold);flex:1;transition:transform .15s ease,box-shadow .15s ease}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600}
.stat .v{font-family:var(--f-num);font-size:17px;font-weight:600;margin-top:2px}
.import-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.denom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.denom-cell{background:var(--surface2);border-radius:7px;padding:8px 10px}
.denom-cell label{font-family:var(--f-num);font-size:13px;font-weight:700;color:var(--gold);text-transform:none}
.denom-cell input{margin-top:4px}
.denom-cell .sub{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--f-num)}
.import-row input[type=file]{width:auto;flex:1;min-width:180px;font-size:12px;padding:5px}
.msg{font-size:12px;margin-top:6px}
.searchbar{margin-bottom:12px}
.searchbar input{max-width:260px}
.voucher-block{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;background:var(--surface)}
.voucher-block .vhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:6px;flex-wrap:wrap;gap:6px}
.voucher-block .vhead .vid{font-family:var(--f-num);color:var(--gold);font-weight:600}
.pill-btn{border:1px solid var(--line);background:var(--surface);padding:4px 10px;font-size:12px;border-radius:20px;cursor:pointer}
.pill-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
select.csel-native{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.csel-wrap{position:relative;display:inline-block}
.csel-btn{display:flex;align-items:center;gap:6px;justify-content:space-between;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font-family:var(--f-ui);font-size:13px;min-width:100%;transition:border-color .15s,background .15s}
.csel-btn:hover{border-color:var(--gold)}
.csel-btn .csel-arrow{font-size:10px;color:var(--muted);transition:transform .15s}
.csel-btn.open .csel-arrow{transform:rotate(180deg)}
.csel-list{display:none;position:fixed;min-width:160px;max-height:260px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:9999;padding:4px}
.csel-list.open{display:block}
.csel-item{padding:7px 10px;font-size:13px;border-radius:4px;cursor:pointer;color:var(--ink);white-space:nowrap}
.csel-item:hover{background:var(--surface2)}
.csel-item.active{background:var(--navy);color:#fff}
.ctrl-group .csel-btn{border:none;background:none;padding:2px 4px}
.mode-toggle{display:inline-flex;background:var(--surface2);border-radius:6px;padding:2px;gap:2px}
.mode-btn{border:none;background:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:4px;cursor:pointer;transition:background .15s,color .15s}
.mode-btn:hover{color:var(--ink)}
.mode-btn.active{background:var(--navy);color:#fff}
#singlePrintHolder{display:none}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:10000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:22px 24px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:modalIn .15s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.modal-msg{font-size:14px;line-height:1.5;margin-bottom:18px;white-space:pre-line}
.modal-btns{display:flex;justify-content:flex-end;gap:8px}
.app-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10001}
.app-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media print{
  body.printing-single .sidebar, body.printing-single .topbar, body.printing-single #panels{display:none!important}
  body.printing-single #singlePrintHolder{display:block!important}
}
@page{ margin: 12mm 10mm; }
@media(max-width:850px){
  .app{flex-direction:column} .sidebar{position:relative;width:100%;height:auto;flex-direction:row;overflow-x:auto;padding:12px}
  .brand{display:none} .navlist{flex-direction:row;flex:none} .sidebar-foot{display:none}
  .grid.acc,.grid.set,.grid.audit{grid-template-columns:1fr} .main{padding:16px}
}
@media print{
  body{background:#fff;color:#000} .sidebar,.no-print,.top-controls{display:none!important}
  .app{display:block} .main{padding:0} .panel{display:none} .panel.print-show{display:block!important}
  .card{border:none;padding:0;margin-bottom:26px;page-break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand" id="sidebarBrandContainer">
      <div class="name" id="sideCoName">Business Name</div>
      <div class="co-sub" id="sideSubTitle">Books of Account</div>
      <div class="tag" id="sideTag">Audit Tracker</div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot">
      <button class="nav-btn" id="settingsNavBtn" style="width:100%;text-align:left;background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.12);padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:8px">
        ⚙ <span id="lblSettingsBtn">Settings</span>
      </button>
      <div style="font-size:10.5px;color:#8a8270;margin-top:4px" id="lblLocalDataNote">Data stored in local browser.</div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle"></h2>
      <div class="top-controls no-print">
        <div class="ctrl-group">
          <label id="lblYearGroup">Year:</label>
          <select id="yearSel" style="border:none;background:var(--surface);color:var(--ink);padding:2px 4px;font-weight:600" aria-label="Reporting year"></select>
        </div>
        <div class="ctrl-group">
          <label id="lblThemeGroup">Theme:</label>
          <span class="mode-toggle" id="modeToggle">
            <button type="button" class="mode-btn" data-mode="light">Light</button>
            <button type="button" class="mode-btn" data-mode="dark">Dark</button>
          </span>
          <select id="themeSel" style="border:none;background:var(--surface);color:var(--ink);padding:2px 4px;" aria-label="Theme palette"></select>
        </div>
        <div class="ctrl-group">
          <label id="lblLangGroup">Lang:</label>
          <select id="langSel" style="border:none;background:var(--surface);color:var(--ink);padding:2px 4px;" aria-label="Language">
            <option value="en">English</option>
            <option value="ur">Roman Urdu</option>
          </select>
        </div>
        <button class="btn-ghost btn-sm" id="printBtn">Export PDF</button>
      </div>
    </div>
    <div id="panels"></div>
    <div id="singlePrintHolder"></div>
    <div id="modalOverlay" class="modal-overlay no-print" role="alertdialog" aria-modal="true">
      <div class="modal-card">
        <div id="modalMsg" class="modal-msg"></div>
        <div id="modalBtns" class="modal-btns"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Settings mein jahan chahein -->
<div style="padding:14px;border:1px solid #ccc;border-radius:10px;margin:10px 0">
  <b>Google Drive Backup</b>
  <p id="gdStatus" style="font-size:13px;opacity:.7;margin:6px 0">Abhi tak backup nahi liya</p>
  <button onclick="gdBackup()">Backup</button>
  <button onclick="gdRestore()">Restore</button>
</div>

<script>
(function () {
  const CLIENT_ID = 'YAHAN_APNA_CLIENT_ID.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  const FILE = 'khata-backup.json';
  const skip = k => k.startsWith('__');
  const status = t => { const e = document.getElementById('gdStatus'); if (e) e.textContent = t; };

  const last = localStorage.getItem('__gd_last');
  if (last) status('Aakhri backup: ' + last);

  function getToken() {
    return new Promise((res, rej) => {
      if (!window.google || !google.accounts) return rej(new Error('Google script load nahi hui. Internet check karein.'));
      google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPE,
        callback: r => r.error ? rej(new Error(r.error)) : res(r.access_token),
        error_callback: e => rej(new Error(e.type || 'Login band ho gaya'))
      }).requestAccessToken();
    });
  }

  async function findFile(token) {
    const q = encodeURIComponent("name='" + FILE + "'");
    const r = await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q=' + q,
      { headers: { Authorization: 'Bearer ' + token } });
    if (!r.ok) throw new Error('Drive error ' + r.status);
    return (await r.json()).files[0];
  }

  window.gdBackup = async function () {
    try {
      status('Backup ho raha hai...');
      const token = await getToken();
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!skip(k)) data[k] = localStorage.getItem(k);
      }
      const existing = await findFile(token);
      const meta = existing ? {} : { name: FILE, parents: ['appDataFolder'] };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
      form.append('file', new Blob([JSON.stringify(data)], { type: 'application/json' }));
      const url = existing
        ? 'https://www.googleapis.com/upload/drive/v3/files/' + existing.id + '?uploadType=multipart'
        : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      const r = await fetch(url, { method: existing ? 'PATCH' : 'POST', headers: { Authorization: 'Bearer ' + token }, body: form });
      if (!r.ok) throw new Error('Upload fail ' + r.status);
      const t = new Date().toLocaleString();
      localStorage.setItem('__gd_last', t);
      status('Aakhri backup: ' + t);
      alert('Backup ho gaya');
    } catch (e) { status('Backup fail'); alert('Backup fail: ' + e.message); }
  };

  window.gdRestore = async function () {
    try {
      const token = await getToken();
      const f = await findFile(token);
      if (!f) return alert('Drive par koi backup nahi mila');
      if (!confirm('Restore se maujooda data backup wale data se badal jayega. Continue?')) return;
      const r = await fetch('https://www.googleapis.com/drive/v3/files/' + f.id + '?alt=media', { headers: { Authorization: 'Bearer ' + token } });
      if (!r.ok) throw new Error('Download fail ' + r.status);
      const obj = await r.json();
      Object.keys(obj).forEach(k => localStorage.setItem(k, obj[k]));
      alert('Restore ho gaya. App reload hogi.');
      location.reload();
    } catch (e) { alert('Restore fail: ' + e.message); }
  };
})();
</script>

function fmt(n, raw=false){
  if(isNaN(n) || n === null) return '—';
  const scale = parseFloat(pref.amountScale || 1);
  n = n / scale;
  const dec = parseInt(pref.decimals !== undefined ? pref.decimals : 2);
  n = Math.round((n + Number.EPSILON) * Math.pow(10, dec)) / Math.pow(10, dec);
  const neg = n < 0;
  n = Math.abs(n);
  const formattedNum = n.toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
  if(raw) return (neg ? '-' : '') + formattedNum;
  return (neg ? '(' : '') + formattedNum + (neg ? ')' : '');
}

function auditClientAmounts(cl){

function enhanceSelect(select){
  if(!select) return;
  // header selects are static HTML and get enhanced on every render: unwrap any previous wrapper first so buttons never stack
  if(select.parentNode && select.parentNode.classList && select.parentNode.classList.contains('csel-wrap')){
    const oldWrap = select.parentNode; oldWrap.parentNode.insertBefore(select, oldWrap); oldWrap.remove(); select.classList.remove('csel-native');
  }
  const wrap = document.createElement('span'); wrap.className='csel-wrap';
  select.parentNode.insertBefore(wrap, select);
  wrap.appendChild(select);
  select.classList.add('csel-native');
  const btn = document.createElement('button'); btn.type='button'; btn.className='csel-btn';
  const list = document.createElement('div'); list.className='csel-list';
  document.body.appendChild(list); // portal: never clipped/hidden by parent overflow or stacking context
  const sync = ()=>{
    const opt = select.options[select.selectedIndex];
    btn.innerHTML = `<span>${opt?opt.textContent:''}</span><span class="csel-arrow">▾</span>`;
    list.querySelectorAll('.csel-item').forEach(it=>it.classList.toggle('active', it.dataset.value===select.value));
  };
  const position = ()=>{
    const r = btn.getBoundingClientRect();
    list.style.left = Math.round(r.left)+'px';
    list.style.top = Math.round(r.bottom+4)+'px';
    list.style.minWidth = Math.round(r.width)+'px';
    if(list.getBoundingClientRect().bottom > window.innerHeight){ list.style.top = Math.round(r.top - list.offsetHeight - 4)+'px'; }
  };
  const closeList = ()=>{ list.classList.remove('open'); btn.classList.remove('open'); };
  [...select.options].forEach(opt=>{
    const item = document.createElement('div'); item.className='csel-item'; item.textContent=opt.textContent; item.dataset.value=opt.value;
    item.onclick = (e)=>{ e.stopPropagation(); select.value = opt.value; select.dispatchEvent(new Event('change',{bubbles:true})); sync(); closeList(); };
    list.appendChild(item);
  });
  btn.onclick = (e)=>{
    e.stopPropagation();
    document.querySelectorAll('.csel-list.open').forEach(l=>{ if(l!==list) l.classList.remove('open'); });
    document.querySelectorAll('.csel-btn.open').forEach(b2=>{ if(b2!==btn) b2.classList.remove('open'); });
    const willOpen = !list.classList.contains('open');
    closeList();
    if(willOpen){ position(); list.classList.add('open'); btn.classList.add('open'); }
  };
  wrap.appendChild(btn);
  sync();
}

/* ---- Themed modal dialogs (replace native confirm()/alert()) ---- */
function showConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    document.getElementById('modalBtns').innerHTML = `<button class="btn-ghost btn-sm" id="modalCancelBtn">Cancel</button><button class="btn-primary btn-sm" id="modalOkBtn">OK</button>`;
    const close = (val)=>{ overlay.classList.remove('open'); document.removeEventListener('keydown', onKey); resolve(val); };
    const onKey = (e)=>{ if(e.key==='Escape') close(false); if(e.key==='Enter') close(true); };
    document.getElementById('modalOkBtn').onclick = ()=>close(true);
    document.getElementById('modalCancelBtn').onclick = ()=>close(false);
    overlay.onclick = (e)=>{ if(e.target===overlay) close(false); };
    document.addEventListener('keydown', onKey);
    overlay.classList.add('open');
    document.getElementById('modalOkBtn').focus();
  });
}
function showAlert(message){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent = message;
    document.getElementById('modalBtns').innerHTML = `<button class="btn-primary btn-sm" id="modalOkBtn">OK</button>`;
    const close = ()=>{ overlay.classList.remove('open'); document.removeEventListener('keydown', onKey); resolve(); };
    const onKey = (e)=>{ if(e.key==='Escape'||e.key==='Enter') close(); };
    document.getElementById('modalOkBtn').onclick = close;
    overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
    document.addEventListener('keydown', onKey);
    overlay.classList.add('open');
    document.getElementById('modalOkBtn').focus();
  });
}
function showToast(message){
  let el = document.getElementById('appToast');
  if(!el){ el = document.createElement('div'); el.id='appToast'; el.className='app-toast'; document.body.appendChild(el); }
  el.textContent = message; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

function upsertAccount(data, err){
  if(!data.name){ err('Account name required.'); return false; }
  const dup = state.accounts.find(a=>a.name.toLowerCase()===data.name.toLowerCase() && a.id!==(editAcc&&editAcc.id));
  if(dup){ err('Account already exists.'); return false; }
  if(editAcc){ Object.assign(editAcc, data); } else { state.accounts.push({id:uid(), ...data}); }
  return true;
}

function renderAccounts(){
  const el = document.getElementById('panel-accounts'); const a = editAcc;
  el.innerHTML = `<div class="card"><h3>${a?'Edit Account':'Add Account'}</h3>
    <div class="grid acc">
      <div><label>Account Name</label><input id="accName" value="${a?a.name:''}"></div>

  el.querySelector('#exportAccBtn').onclick = ()=>{

  el.querySelector('#importAccBtn').onclick = ()=>{

        const type = TYPES.find(t=>t.toLowerCase()===typeRaw.toLowerCase());
        if(!name || !type){ skipped++; return; }
        const isCashRaw = String(row.iscash||'').trim().toLowerCase();
        const isCash = ['1','y','yes','true'].includes(isCashRaw);
        const cfRaw = (row.cf || row.cfcategory || '').trim();
        const cf = CF_CATS.find(c=>c.toLowerCase()===cfRaw.toLowerCase()) || 'Operating';
        if(upsertAccount({ name, type, isCash, cf: isCash?null:cf }, ()=>{})){ added++; } else { skipped++; }

      save(); renderAll();

  wrap.querySelectorAll('[data-d]').forEach(b=>b.onclick=async ()=>{
    const id=b.dataset.d;

    if(!(await showConfirm('Delete this account?'))) return;
    state.accounts = state.accounts.filter(x=>x.id!==id); save(); renderAll();
  });
}

/* ---------------- Journal Vouchers ---------------- */
function vouchersForYear(idx){
  const legs = entriesIn(idx); const map = new Map();
  legs.forEach(l=>{ if(!map.has(l.voucher)) map.set(l.voucher, {voucher:l.voucher, date:l.date, narration:l.narration, legs:[]}); map.get(l.voucher).legs.push(l); });
  return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date));
}

function renderJournal(){
  const el = document.getElementById('panel-journal'); const idx = selIdx();
  const opts = state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  el.innerHTML = `<div class="card"><h3>${editingVoucher?'Edit Voucher '+editingVoucher:'New Journal Voucher'} <span class="small">${state.years[idx]?.name||''}</span></h3>
  ${!state.accounts.length ? `<p class="empty">${t('noAcc')}</p>` : `
  <div class="grid" style="grid-template-columns:160px 1fr">
    <div><label>Date</label><input type="date" id="vDate" value="${draft.date||new Date().toISOString().slice(0,10)}"></div>
    <div><label>Narration</label><input id="vNar" value="${draft.narration||''}"></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 120px 140px auto;margin-top:10px">
    <div><label>Account</label><select id="lnAcc">${opts}</select></div>
    <div><label>Dr / Cr</label><select id="lnSide"><option value="dr">Debit</option><option value="cr">Credit</option></select></div>
    <div><label>Amount</label><input type="number" step="0.01" id="lnAmt"></div>
    <div style="align-self:end"><button class="btn-ghost" id="addLineBtn" style="width:100%">+ Add Line</button></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:8px;max-width:520px">
    <div><label>Audit Client (optional)</label><select id="lnClient"><option value="">None</option>${auditClientsForYear().map(c=>`<option value="${c.id}">${c.clientName}</option>`).join('')}</select></div>
    <div><label>Tag as</label><select id="lnRole"><option value="exp">My Expense</option><option value="firm">Firm Allowance</option><option value="client">Client Allowance</option></select></div>
  </div>
  <div id="draftLinesWrap" style="margin-top:12px"></div>
  <div id="vTotals" style="margin-top:8px"></div>
  <div style="margin-top:10px;display:flex;gap:8px">
    <button class="btn-primary" id="postVBtn">${editingVoucher?'Save Voucher':'Post Voucher'}</button>
    <button class="btn-ghost" id="cancelVBtn">${editingVoucher?'Cancel Edit':'Clear'}</button>
  </div>`}<div id="vErr" class="err"></div></div>
  <div class="card">
    <h3>Import / Export Journal Entries CSV</h3>
    <div class="import-row">
      <input type="file" id="jeCsvFile" accept=".csv">
      <button class="btn-ghost btn-sm" id="importJeBtn">Upload & Import Vouchers CSV</button>
      <button class="btn-ghost btn-sm" id="exportJeBtn">Export Vouchers CSV</button>
    </div>
    <div id="jeCsvMsg" class="msg"></div>
  </div>
  <div class="card">
    <h3>Vouchers — ${vouchersForYear(idx).length} in this year</h3>
    <div class="searchbar" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input id="jeSearch" placeholder="Search voucher # or narration..." value="${jeFilter}">
      <label style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);text-transform:none;font-weight:400"><input type="checkbox" id="selAllChk" style="width:auto"> Select all</label>
      <button class="rowbtn danger" id="bulkDeleteBtn" disabled>Delete Selected (<span id="selCount">0</span>)</button>
      <button class="btn-ghost btn-sm" id="renumberBtn" style="margin-left:auto">Renumber Vouchers (1, 2, 3…)</button>
      <button class="btn-ghost btn-sm" id="clearYearBtn">Clear all entries in this year</button>
    </div>
    <div id="voucherListWrap"></div>
  </div>`;

  if(state.accounts.length){
    const renderLines = ()=>{
      const w = el.querySelector('#draftLinesWrap');
      if(!draft.lines.length){ w.innerHTML='<p class="empty">No lines added yet. Minimum 2 lines required.</p>'; }
      else { w.innerHTML = `<table><thead><tr><th>Account</th><th class="num">Debit ${getHeaderUnitNote()}</th><th class="num">Credit ${getHeaderUnitNote()}</th><th></th></tr></thead>
        <tbody>${draft.lines.map((l,i)=>`<tr><td>${accById(l.accId)?.name||'—'}${auditTagBadge(l)}</td><td class="num">${l.dr?fmt(l.dr):''}</td>
        <td class="num">${l.cr?fmt(l.cr):''}</td><td><button class="rowbtn danger" data-i="${i}">Remove</button></td></tr>`).join('')}</tbody></table>`;
        w.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ draft.lines.splice(parseInt(b.dataset.i),1); renderLines(); renderTotals(); }); }
    };
    const renderTotals = ()=>{
      const totDr = draft.lines.reduce((s,l)=>s+l.dr,0), totCr = draft.lines.reduce((s,l)=>s+l.cr,0);
      const bal = Math.abs(totDr-totCr)<0.005;
      el.querySelector('#vTotals').innerHTML = `<div class="stat-row" style="margin-bottom:0">
        <div class="stat"><div class="l">Total Debit</div><div class="v">${fmt(totDr)}</div></div>
        <div class="stat"><div class="l">Total Credit</div><div class="v">${fmt(totCr)}</div></div>
        <div class="stat" style="border-left-color:${bal?'var(--good)':'var(--bad)'}"><div class="l">Difference</div><div class="v" style="color:${bal?'var(--good)':'var(--bad)'}">${fmt(totDr-totCr)}</div></div></div>`;
    };
    renderLines(); renderTotals();
    enhanceSelect(el.querySelector('#lnAcc')); enhanceSelect(el.querySelector('#lnSide')); enhanceSelect(el.querySelector('#lnClient')); enhanceSelect(el.querySelector('#lnRole'));
    el.querySelector('#addLineBtn').onclick = ()=>{
      const accId = el.querySelector('#lnAcc').value, side = el.querySelector('#lnSide').value, amt = parseFloat(el.querySelector('#lnAmt').value);
      const err = m=>el.querySelector('#vErr').textContent=m; err('');
      if(!accId){ err('Select an account.'); return; }
      if(!amt || amt<=0){ err('Enter valid amount.'); return; }
      draft.date = el.querySelector('#vDate').value; draft.narration = el.querySelector('#vNar').value;
      const auditClientId = el.querySelector('#lnClient').value || null; const auditRole = auditClientId ? el.querySelector('#lnRole').value : null;
      draft.lines.push({accId, dr: side==='dr'?amt:0, cr: side==='cr'?amt:0, auditClientId, auditRole});
      el.querySelector('#lnAmt').value=''; renderLines(); renderTotals();
    };
    el.querySelector('#postVBtn').onclick = ()=>{
      draft.date = el.querySelector('#vDate').value; draft.narration = el.querySelector('#vNar').value;
      const err = m=>el.querySelector('#vErr').textContent=m; err('');
      if(!draft.date){ err('Date required.'); return; }
      if(draft.lines.length<2){ err('At least 2 lines required.'); return; }
      const totDr = draft.lines.reduce((s,l)=>s+l.dr,0), totCr = draft.lines.reduce((s,l)=>s+l.cr,0);
      if(Math.abs(totDr-totCr)>0.005){ err('Unbalanced voucher: Total Debit must equal Total Credit.'); return; }
      const voucher = editingVoucher || nextVoucherNo(idx);
      if(editingVoucher) state.entries = state.entries.filter(e=>e.voucher!==editingVoucher);
      draft.lines.forEach(l=> state.entries.push({id:uid(), yearId: state.currentYearId, date: draft.date, voucher, accId:l.accId, dr:l.dr, cr:l.cr, narration: draft.narration, auditClientId:l.auditClientId||null, auditRole:l.auditRole||null}));
      draft={date:'',narration:'',lines:[]}; editingVoucher=null; save(); renderAll();
    };
    el.querySelector('#cancelVBtn').onclick = ()=>{ draft={date:'',narration:'',lines:[]}; editingVoucher=null; renderAll(); };
  }

  el.querySelector('#exportJeBtn').onclick = ()=>{
    const curEntries = entriesIn(idx);
    const rows = [['Year','Date','Voucher','Account','Debit','Credit','Narration'],
      ...curEntries.map(e=>[state.years[idx]?.name||'', e.date, e.voucher, accById(e.accId)?.name||'', e.dr||'', e.cr||'', e.narration||''])];
    downloadCSV(rows, `journal_entries_${state.years[idx]?.name||'export'}.csv`);
  };

  el.querySelector('#importJeBtn').onclick = ()=>{
    const file = el.querySelector('#jeCsvFile').files[0];
    const msg = el.querySelector('#jeCsvMsg'); msg.textContent='';
    if(!file){ msg.className='msg err'; msg.textContent='Please select a CSV file first.'; return; }
    Papa.parse(file, { header:true, skipEmptyLines:true, transformHeader:h=>h.trim().toLowerCase(), complete:(res)=>{
      const groups = new Map();
      res.data.forEach(row=>{
        const yr = (row.year||'').trim();
        const vRaw = (row.voucher||'').trim();
        const dt = (row.date||'').trim();
        const nar = (row.narration||'').trim();
        const key = yr+'||'+(vRaw || (dt+'|'+nar));
        if(!groups.has(key)) groups.set(key, {yr, vRaw, date:dt, narration:nar, rows:[]});
        groups.get(key).rows.push(row);
      });
      let addedV=0, addedL=0, skipped=0;
      groups.forEach(g=>{
        let yObj = g.yr ? state.years.find(y=>y.name.toLowerCase()===g.yr.toLowerCase()) : state.years.find(y=>y.id===state.currentYearId);
        if(g.yr && !yObj){ yObj={id:uid(),name:g.yr}; state.years.push(yObj); }
        let ok=true, legs=[], sd=0, sc=0;
        g.rows.forEach(row=>{
          const accName = (row.account||'').trim();
          const acc = state.accounts.find(a=>a.name.toLowerCase()===accName.toLowerCase());
          const d = parseFloat(row.debit || row.dr) || 0;
          const c = parseFloat(row.credit || row.cr) || 0;
          if(!acc || (!d && !c) || !g.date){ ok=false; return; }
          legs.push({accId:acc.id, dr:d, cr:c}); sd+=d; sc+=c;
        });
        if(!ok || !yObj || legs.length<1 || Math.abs(sd-sc)>0.005){ skipped += g.rows.length; return; }
        const voucher = g.vRaw || uid();
        legs.forEach(l=> state.entries.push({id:uid(), yearId:yObj.id, date:g.date, voucher, accId:l.accId, dr:l.dr, cr:l.cr, narration:g.narration}));
        addedV++; addedL+=legs.length;
      });
      save(); renderAll();
      msg.className='msg ok'; msg.textContent=`Import finished: ${addedV} voucher(s) / ${addedL} line(s) imported.`;
    }});
  };

  const sInput = el.querySelector('#jeSearch');
  if(sInput){ sInput.oninput = ()=>{ jeFilter = sInput.value; renderVoucherList(el, idx); }; }
  el.querySelector('#selAllChk').onchange = (ev)=>{
    const list = vouchersForYear(idx).filter(v=> !jeFilter.trim() || matchesFilter(v, jeFilter));
    if(ev.target.checked) list.forEach(v=>selectedVouchers.add(v.voucher)); else selectedVouchers.clear();
    renderVoucherList(el, idx);
  };
  el.querySelector('#renumberBtn').onclick = async ()=>{
    const vList = vouchersForYear(idx);
    if(!vList.length) return;
    if(!(await showConfirm(`Renumber all ${vList.length} voucher(s) in this year to start from JV-0001 (in date order)?`))) return;
    const sorted = [...vList].sort((a,b)=> a.date.localeCompare(b.date) || a.voucher.localeCompare(b.voucher));
    const map = new Map();
    sorted.forEach((v,i)=> map.set(v.voucher, 'JV-'+String(i+1).padStart(4,'0')));
    state.entries.forEach(e=>{ if(yearIdx(e.yearId)===idx && map.has(e.voucher)) e.voucher = map.get(e.voucher); });
    save(); renderAll(); showToast('Vouchers renumbered.');
  };
  el.querySelector('#clearYearBtn').onclick = async ()=>{
    const list = vouchersForYear(idx);
    if(!list.length) return;
    if(!(await showConfirm('Are you sure you want to clear all entries in this year?'))) return;
    state.entries = state.entries.filter(e=>yearIdx(e.yearId)!==idx);
    selectedVouchers.clear(); save(); renderAll();
  };
  el.querySelector('#bulkDeleteBtn').onclick = async ()=>{
    if(!selectedVouchers.size) return;
    if(!(await showConfirm('Delete selected vouchers?'))) return;
    state.entries = state.entries.filter(e=>!selectedVouchers.has(e.voucher));
    selectedVouchers.clear(); save(); renderAll();
  };

  renderVoucherList(el, idx);
}

function matchesFilter(v, q){ q=q.toLowerCase(); return v.voucher.toLowerCase().includes(q) || (v.narration&&v.narration.toLowerCase().includes(q)) || v.legs.some(l=>(accById(l.accId)?.name||'').toLowerCase().includes(q)); }

function renderVoucherList(el, idx){
  const wrap = el.querySelector('#voucherListWrap');
  let list = vouchersForYear(idx);
  if(jeFilter.trim()) list = list.filter(v=>matchesFilter(v, jeFilter));
  const selCountEl = el.querySelector('#selCount'), bulkBtn = el.querySelector('#bulkDeleteBtn'), selAllChk = el.querySelector('#selAllChk');
  const visibleVouchers = new Set(list.map(v=>v.voucher));
  [...selectedVouchers].forEach(v=>{ if(!visibleVouchers.has(v)) selectedVouchers.delete(v); });
  if(selCountEl) selCountEl.textContent = selectedVouchers.size;
  if(bulkBtn) bulkBtn.disabled = selectedVouchers.size===0;
  if(selAllChk) selAllChk.checked = list.length>0 && list.every(v=>selectedVouchers.has(v.voucher));
  if(!list.length){ wrap.innerHTML=`<p class="empty">${t('noEntries')}</p>`; return; }
  wrap.innerHTML = list.map(v=>{
    const totDr = v.legs.reduce((s,l)=>s+l.dr,0);
    return `<div class="voucher-block"><div class="vhead"><span style="display:flex;align-items:center;gap:8px">
    <input type="checkbox" class="vchk" data-v="${v.voucher}" style="width:auto" ${selectedVouchers.has(v.voucher)?'checked':''}>
    <span class="vid">${v.voucher}</span> · ${v.date} ${v.narration?'— '+v.narration:''}</span>
    <span class="btn-group"><button class="rowbtn" data-pdf="${v.voucher}">PDF</button><button class="rowbtn" data-xls="${v.voucher}">Excel</button><button class="rowbtn" data-e="${v.voucher}" title="Edit">${t('edit')}</button><button class="rowbtn danger" data-d="${v.voucher}" title="Delete">${t('delete')}</button></span></div>
    <table>
      <thead><tr><th>Account</th><th class="num">Debit ${getHeaderUnitNote()}</th><th class="num">Credit ${getHeaderUnitNote()}</th></tr></thead>
      <tbody>${v.legs.map(l=>`<tr><td>${accById(l.accId)?.name||'—'}${auditTagBadge(l)}</td><td class="num">${l.dr?fmt(l.dr):''}</td><td class="num">${l.cr?fmt(l.cr):''}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>${t('total')}</td><td class="num">${fmt(totDr)}</td><td class="num">${fmt(totDr)}</td></tr></tfoot>
    </table></div>`;
  }).join('');
  wrap.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>{
    const v = list.find(x=>x.voucher===b.dataset.pdf);
    const totDr = v.legs.reduce((s,l)=>s+l.dr,0);
    const html = `<div class="report-head"><div class="title">Journal Voucher ${v.voucher}</div><div class="sub">${v.date}${v.narration?' — '+v.narration:''}</div></div>
    <table><thead><tr><th>Account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
    <tbody>${v.legs.map(l=>`<tr><td>${accById(l.accId)?.name||'—'}</td><td class="num">${l.dr?fmt(l.dr):''}</td><td class="num">${l.cr?fmt(l.cr):''}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${fmt(totDr)}</td><td class="num">${fmt(totDr)}</td></tr></tfoot></table>`;
    printSingle(html);
  });
  wrap.querySelectorAll('[data-xls]').forEach(b=>b.onclick=()=>{
    const v = list.find(x=>x.voucher===b.dataset.xls);
    const out = [['Voucher',v.voucher],['Date',v.date],['Narration',v.narration||''],[],['Account','Debit','Credit'],
      ...v.legs.map(l=>[accById(l.accId)?.name||'—', l.dr?l.dr.toFixed(2):'', l.cr?l.cr.toFixed(2):''])];
    downloadCSV(out, `voucher_${v.voucher}.csv`);
  });
  wrap.querySelectorAll('.vchk').forEach(c=>c.onchange=()=>{
    if(c.checked) selectedVouchers.add(c.dataset.v); else selectedVouchers.delete(c.dataset.v);
    if(selCountEl) selCountEl.textContent = selectedVouchers.size;
    if(bulkBtn) bulkBtn.disabled = selectedVouchers.size===0;
    if(selAllChk) selAllChk.checked = list.length>0 && list.every(v=>selectedVouchers.has(v.voucher));
  });
  wrap.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{
    const v = state.entries.filter(e=>e.voucher===b.dataset.e);
    editingVoucher = b.dataset.e; draft = { date:v[0].date, narration:v[0].narration, lines: v.map(l=>({accId:l.accId,dr:l.dr,cr:l.cr,auditClientId:l.auditClientId||null,auditRole:l.auditRole||null})) };
    renderAll(); scrollToPanelTop('panel-journal');
  });
  wrap.querySelectorAll('[data-d]').forEach(b=>b.onclick=async ()=>{
    if(!(await showConfirm('Delete this voucher?'))) return;
    state.entries = state.entries.filter(e=>e.voucher!==b.dataset.d); selectedVouchers.delete(b.dataset.d); save(); renderAll();
  });
}

/* ---------------- Ledgers ---------------- */
function counterparties(leg){
  const others = state.entries.filter(e=>e.voucher===leg.voucher && e.id!==leg.id);
  if(!others.length) return '—';
  if(others.length<=2) return others.map(o=>accById(o.accId)?.name||'—').join(', ');
  return 'Multiple ('+others.length+')';
}
let ledgerFilter='';
function ledgerCardData(a, idx){
  const rows = entriesIn(idx).filter(e=>e.accId===a.id).sort((x,y)=>x.date.localeCompare(y.date));
  const opening = isPL(a) ? 0 : (idx>0 ? calcBalance(a, entriesUpTo(idx-1)).net : 0);
  let running = opening;
  const dataRows = rows.map(e=>{ const delta = normalIsDebit(a.type) ? (e.dr-e.cr) : (e.cr-e.dr); running += delta;
    return {date:e.date, against:counterparties(e), dr:e.dr, cr:e.cr, bal:running}; });
  const closing = balanceFor(a, idx).net;
  return {rows:dataRows, opening, closing};
}
function renderLedgers(){
  const el = document.getElementById('panel-ledgers'); const idx = selIdx();
  if(!state.accounts.length){ el.innerHTML=`<div class="card"><p class="empty">${t('noAcc')}</p></div>`; return; }
  el.innerHTML = `<div class="report-head">
    <div class="co">${pref.companyName||''}</div>
    <div class="title">${t('ledgers')}</div>
    <div class="sub">${shortYear(state.years[idx]?.name)||''}</div>
    <div class="unit-note" style="font-size:11px;color:var(--muted);font-style:italic;margin-top:4px">${getHeaderUnitNote()}</div>
  </div>
  <div class="searchbar no-print" style="margin-bottom:14px"><input id="ledgerSearch" placeholder="Search by account name or code…" value="${ledgerFilter}"></div>
  <div id="ledgerCardsWrap"></div>`;
  el.querySelector('#ledgerSearch').oninput = (ev)=>{ ledgerFilter = ev.target.value; renderLedgerCards(idx); };
  renderLedgerCards(idx);
}
function renderLedgerCards(idx){
  const wrap = document.getElementById('ledgerCardsWrap'); if(!wrap) return;
  let list = state.accounts;
  if(ledgerFilter.trim()){ const q=ledgerFilter.toLowerCase(); list = list.filter(a=>a.name.toLowerCase().includes(q) || acctCode(a).includes(q)); }
  const cards = list.map(a=>{
    const {rows, opening, closing} = ledgerCardData(a, idx);
    if(!rows.length && opening===0) return '';
    const tableHtml = `<table><thead><tr><th>Date</th><th>Against</th><th class="num">${t('dr')}</th><th class="num">${t('cr')}</th><th class="num">${t('balance')}</th></tr></thead>
    <tbody>${!isPL(a) ? `<tr><td colspan="4">Balance brought forward</td><td class="num">${fmt(opening)}</td></tr>`:''}
    ${rows.map(r=>`<tr><td>${r.date}</td><td>${r.against}</td><td class="num">${r.dr?fmt(r.dr):''}</td><td class="num">${r.cr?fmt(r.cr):''}</td><td class="num">${fmt(r.bal)}</td></tr>`).join('')}</tbody></table>`;
    return `<div class="card"><h3><span><span class="code-badge">${acctCode(a)}</span>${a.name} <span class="tag ${a.type}">${a.type} · Closing ${fmt(closing)}</span></span>
    <span class="controls no-print"><button class="rowbtn" data-pdf="${a.id}">PDF</button><button class="rowbtn" data-xls="${a.id}">Excel</button></span></h3>
    ${tableHtml}</div>`;

  wrap.innerHTML = cards || `<div class="card"><p class="empty">${t('noEntries')}</p></div>`;
  wrap.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>{
    const a = accById(b.dataset.pdf); const idxN = selIdx(); const {rows, opening, closing} = ledgerCardData(a, idxN);
    const html = `<div class="report-head"><div class="title">${acctCode(a)} · ${a.name}</div><div class="sub">${a.type} — ${shortYear(state.years[idxN]?.name)||''}</div></div>
    <table><thead><tr><th>Date</th><th>Against</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead>
    <tbody>${!isPL(a) ? `<tr><td colspan="4">Balance brought forward</td><td class="num">${fmt(opening)}</td></tr>`:''}
    ${rows.map(r=>`<tr><td>${r.date}</td><td>${r.against}</td><td class="num">${r.dr?fmt(r.dr):''}</td><td class="num">${r.cr?fmt(r.cr):''}</td><td class="num">${fmt(r.bal)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="4">Closing Balance</td><td class="num">${fmt(closing)}</td></tr></tfoot></table>`;
    printSingle(html);
  });
  wrap.querySelectorAll('[data-xls]').forEach(b=>b.onclick=()=>{
    const a = accById(b.dataset.xls); const idxN = selIdx(); const {rows, opening, closing} = ledgerCardData(a, idxN);
    const out = [['Date','Against','Debit','Credit','Balance']];
    if(!isPL(a)) out.push(['','Balance brought forward','','',opening.toFixed(2)]);
    rows.forEach(r=>out.push([r.date, r.against, r.dr?r.dr.toFixed(2):'', r.cr?r.cr.toFixed(2):'', r.bal.toFixed(2)]));
    out.push(['','Closing Balance','','',closing.toFixed(2)]);
    downloadCSV(out, `ledger_${acctCode(a)}_${a.name.replace(/[^a-z0-9]+/gi,'_')}.csv`);
  });
}

/* ---------------- Trial Balance ---------------- */
function cumulativeRetained(uptoIdx){ let s=0; for(let i=0;i<=uptoIdx;i++) s+=plFor(i).net; return s; }
function tbRowsData(idx){
  const priorRetained = idx > 0 ? cumulativeRetained(idx - 1) : 0;
  const rows = [];
  if(Math.abs(priorRetained) > 0.005){
    const openDr = priorRetained<0?Math.abs(priorRetained):0, openCr = priorRetained>0?priorRetained:0;
    rows.push({name:'Retained Earnings (B/F)', code:'', type:'Equity', openDr, openCr, perDr:0, perCr:0, closeDr:openDr, closeCr:openCr});
  }
  state.accounts.forEach(a=>{
    const openNet = isPL(a) ? 0 : (idx>0 ? calcBalance(a, entriesUpTo(idx-1)).net : 0);
    const period = calcBalance(a, entriesIn(idx));
    const closeNet = balanceFor(a, idx).net;
    const openDr = normalIsDebit(a.type)?Math.max(openNet,0):Math.max(-openNet,0);
    const openCr = normalIsDebit(a.type)?Math.max(-openNet,0):Math.max(openNet,0);
    const closeDr = normalIsDebit(a.type)?Math.max(closeNet,0):Math.max(-closeNet,0);
    const closeCr = normalIsDebit(a.type)?Math.max(-closeNet,0):Math.max(closeNet,0);
    if(!openDr && !openCr && !period.dr && !period.cr && !closeDr && !closeCr) return;
    rows.push({name:a.name, code:acctCode(a), type:a.type, openDr, openCr, perDr:period.dr, perCr:period.cr, closeDr, closeCr});
  });
  return rows;
}

        </tbody>

        <tbody>

        </tbody>
        <tfoot><tr><td colspan="2">${t('total')}</td><td class="num">${fmt(rows.reduce((s,r)=>s+r.openDr,0))}</td><td class="num">${fmt(rows.reduce((s,r)=>s+r.openCr,0))}</td><td class="num">${fmt(rows.reduce((s,r)=>s+r.perDr,0))}</td><td class="num">${fmt(rows.reduce((s,r)=>s+r.perCr,0))}</td><td class="num">${fmt(totDr)}</td><td class="num">${fmt(totCr)}</td></tr></tfoot>

  el.innerHTML = `<div class="card">

  el.querySelector('#tb2ViewBtn').onclick = ()=>{ pref.tbView='2col'; savePref(); renderTB(); };

    downloadCSV(rowsOut, `trial_balance_${view}_${state.years[idx]?.name||''}.csv`);

/* ---------------- P&L ---------------- */
function plFor(idx){
  if(idx<0) return {inc:[], exp:[], totInc:0, totExp:0, net:0};
  const inc = state.accounts.filter(a=>a.type==='Income').map(a=>({a,v:balanceFor(a,idx).net}));
  const exp = state.accounts.filter(a=>a.type==='Expense').map(a=>({a,v:balanceFor(a,idx).net}));
  const totInc = inc.reduce((s,x)=>s+x.v,0), totExp = exp.reduce((s,x)=>s+x.v,0);
  return {inc,exp,totInc,totExp,net:totInc-totExp};
}

  const el = document.getElementById('panel-pl'); const idx = selIdx();

/* ---------------- Balance Sheet ---------------- */

/* ---------------- Cash Flow ---------------- */
function indirectCF(idx){
  if(idx<0) return {netProfit:0, buckets:{Operating:0,Investing:0,Financing:0}, lines:[], totalCF:0, openCash:0, closeCash:0, actual:0};
  const {net: netProfit} = plFor(idx);
  const buckets={Operating:netProfit,Investing:0,Financing:0}; const lines=[];
  state.accounts.filter(a=>!a.isCash && !isPL(a)).forEach(a=>{
    const opening = idx>0 ? calcBalance(a, entriesUpTo(idx-1)).net : 0;
    const closing = calcBalance(a, entriesUpTo(idx)).net;
    const delta = closing-opening; if(Math.abs(delta)<0.005) return;
    const cashEffect = a.type==='Asset' ? -delta : delta;
    const cat = a.cf || 'Operating';
    buckets[cat]+=cashEffect; lines.push({cat,name:a.name,cashEffect});
  });
  const totalCF = buckets.Operating+buckets.Investing+buckets.Financing;
  const cashAccs = state.accounts.filter(a=>a.isCash);
  const openCash = idx>0 ? cashAccs.reduce((s,a)=>s+calcBalance(a,entriesUpTo(idx-1)).net,0) : 0;
  const closeCash = cashAccs.reduce((s,a)=>s+calcBalance(a,entriesUpTo(idx)).net,0);
  return {netProfit, buckets, lines, totalCF, openCash, closeCash, actual: closeCash-openCash};
}

        <div><label>Client Allowance (override)</label><input type="number" step="1" id="audClientAll" placeholder="auto from JVs" value="${edit ? ovVal(edit.clientOverride) : ''}"></div>
        <div style="align-self:end"><button class="btn-primary" id="saveAuditBtn" style="width:100%">${edit ? t('save') : t('add')}</button></div>
        <div style="align-self:end">${edit ? '<button class="btn-ghost" id="cancelAuditBtn">Cancel</button>' : ''}</div>
      </div>
      <div id="auditErr" class="err"></div>
      <p class="small" style="margin-top:8px">Amounts are fetched automatically from Journal lines tagged to this client (Journal Entries: "Audit Client" + "Tag as"). Leave override blank to use the fetched value; enter a number only when the claimed amount differs from the JV (e.g. JV 8,000 but allowance 5,800).</p>
    </div>

    <div class="card">
      <div class="report-head">
        <div class="co">${pref.companyName||''}</div>
        <div class="title">Audit Clients Expense & Allowance Summary</div>
        <div class="sub">${shortYear(state.years[idx]?.name)||''}</div>
        <div class="unit-note">${getHeaderUnitNote()}</div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="l">Total My Expenses</div><div class="v" style="color:var(--bad)">${fmt(totExp)}</div></div>
        <div class="stat"><div class="l">Firm Allowance</div><div class="v">${fmt(totFirm)}</div></div>
        <div class="stat"><div class="l">Client Allowance</div><div class="v">${fmt(totClient)}</div></div>
        <div class="stat" style="border-left-color:${totNet>=0?'var(--good)':'var(--bad)'}">
          <div class="l">${totNet>=0 ? 'Savings / Profit' : 'Net Cost Incurred'}</div>
          <div class="v" style="color:${totNet>=0?'var(--good)':'var(--bad)'}">${fmt(Math.abs(totNet))}</div>
        </div>
      </div>
      ${!rowsData.length ? '<p class="empty">No audit clients for this year yet.</p>' : `
        <table>
          <thead><tr><th>Client Name</th><th class="num">My Expenses</th><th class="num">Firm Allowance</th><th class="num">Client Allowance</th><th class="num">Net Cost / (Savings)</th><th></th></tr></thead>
          <tbody>
            ${rowsData.map(r=>{
              const netCost = r.a.net;
              return `<tr>
                <td><strong>${r.cl.clientName}</strong></td>
                ${cellHtml(r,'exp')}${cellHtml(r,'firm')}${cellHtml(r,'client')}
                <td class="num" style="font-weight:600;color:${netCost>0?'var(--bad)':'var(--good)'}">${netCost > 0 ? fmt(netCost) : (netCost < 0 ? '(' + fmt(Math.abs(netCost)) + ')' : '0.00')}</td>
                <td class="btn-group"><button class="rowbtn" data-e="${r.cl.id}">${t('edit')}</button><button class="rowbtn danger" data-d="${r.cl.id}">${t('delete')}</button></td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr><td>Total</td><td class="num">${fmt(totExp)}</td><td class="num">${fmt(totFirm)}</td><td class="num">${fmt(totClient)}</td>
            <td class="num" style="color:${totNet>=0?'var(--good)':'var(--bad)'}">${totNet < 0 ? fmt(Math.abs(totNet)) : '(' + fmt(totNet) + ')'}</td><td></td></tr></tfoot>
        </table>`}
    </div>`;

  const numOrNull = id => { const v = el.querySelector(id).value; return v==='' ? null : (parseFloat(v)||0); };
  el.querySelector('#saveAuditBtn').onclick = () => {
    const err = m => el.querySelector('#auditErr').textContent = m; err('');
    const clientName = el.querySelector('#audClient').value.trim();
    if(!clientName){ err('Client name is required.'); return; }
    const data = { clientName, expOverride:numOrNull('#audExp'), firmOverride:numOrNull('#audFirm'), clientOverride:numOrNull('#audClientAll') };
    if(edit){ Object.assign(edit, data); editAudit = null; }
    else { state.auditClients.push({ id:uid(), yearId:state.currentYearId, ...data }); }
    save(); renderAll();
  };
  const cb = el.querySelector('#cancelAuditBtn'); if(cb) cb.onclick = ()=>{ editAudit=null; renderAll(); };
  el.querySelectorAll('[data-reset]').forEach(a=>a.onclick=(ev)=>{
    ev.preventDefault();
    const [id, field] = a.dataset.reset.split(':'); const cl = state.auditClients.find(x=>x.id===id);
    if(cl){ cl[field+'Override'] = null; save(); renderAll(); }
  });
  el.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { editAudit = state.auditClients.find(x => x.id === b.dataset.e); renderAll(); scrollToPanelTop('panel-audit'); });
  el.querySelectorAll('[data-d]').forEach(b => b.onclick = async () => {
    if(!(await showConfirm('Delete this client? JV lines tagged to it stay in the books but lose the tag.'))) return;
    state.entries.forEach(e=>{ if(e.auditClientId===b.dataset.d){ e.auditClientId=null; e.auditRole=null; } });
    state.auditClients = state.auditClients.filter(x => x.id !== b.dataset.d);
    save(); renderAll();
  });
}

/* ---------------- Settings Panel ---------------- */
function renderSettings(){
  const el = document.getElementById('panel-settings');
  el.innerHTML = `
    <div class="card">
      <h3>Sidebar & Brand Name Settings</h3>
      <div class="grid yr" style="margin-bottom:12px">
        <div><label>Business / Company Name (Top Left)</label><input id="setCoName" value="${pref.companyName||''}"></div>
        <div><label>Show Brand in Sidebar?</label>
          <select id="setShowBrand">
            <option value="1" ${pref.showBrandSidebar!==false?'selected':''}>Yes (Show)</option>
            <option value="0" ${pref.showBrandSidebar===false?'selected':''}>No (Hide)</option>
          </select>
        </div>
      </div>
      <div class="grid set" style="margin-bottom:12px">
        <div><label>Subtitle / Books Text</label><input id="setSubText" value="${pref.subTitleText||''}"></div>
        <div><label>Tag / Tracker Text</label><input id="setTagText" value="${pref.tagText||''}"></div>
      </div>
      <button class="btn-primary" id="saveBrandBtn">Save Brand Settings</button>
    </div>

    <div class="card">
      <h3>${t('numberFmt')}</h3>
      <div class="grid set">
        <div><label>${t('currLbl')}</label><input id="setCurr" value="${pref.currencySymbol||'PKR'}"></div>
        <div><label>${t('decimalsLbl')}</label><select id="setDec"><option value="0" ${pref.decimals===0?'selected':''}>0</option><option value="2" ${pref.decimals===2?'selected':''}>2</option></select></div>
        <div><label>${t('scaleLbl')}</label><select id="setScale">
          <option value="1" ${pref.amountScale==='1'?'selected':''}>Exact (1)</option>
          <option value="1000" ${pref.amountScale==='1000'?'selected':''}>Thousands ('000)</option>
          <option value="1000000" ${pref.amountScale==='1000000'?'selected':''}>Millions (M)</option>
        </select></div>
        <div><label>${t('compLbl')}</label><select id="setComp"><option value="1" ${pref.showComparative?'selected':''}>Yes</option><option value="0" ${!pref.showComparative?'selected':''}>No</option></select></div>
      </div>
      <div style="margin-top:10px"><button class="btn-primary" id="saveNumBtn">${t('save')}</button></div>
    </div>

    <div class="card">
      <h3>${t('customTextLbl')}</h3>
      <div class="grid set">
        <div><label>P&amp;L Title</label><input id="txtPL" value="${pref.txtPL||''}"></div>
        <div><label>Balance Sheet Title</label><input id="txtBS" value="${pref.txtBS||''}"></div>
        <div><label>Cash Flow Title</label><input id="txtCF" value="${pref.txtCF||''}"></div>
        <div><label>Trial Balance Title</label><input id="txtTB" value="${pref.txtTB||''}"></div>
      </div>
      <div style="margin-top:10px"><button class="btn-primary" id="saveTxtBtn">${t('save')}</button></div>
    </div>`;

  enhanceSelect(el.querySelector('#setShowBrand'));
  enhanceSelect(el.querySelector('#setDec'));
  enhanceSelect(el.querySelector('#setScale'));
  enhanceSelect(el.querySelector('#setComp'));

  el.querySelector('#saveBrandBtn').onclick = ()=>{
    pref.companyName = el.querySelector('#setCoName').value.trim();
    pref.showBrandSidebar = el.querySelector('#setShowBrand').value === '1';
    pref.subTitleText = el.querySelector('#setSubText').value.trim();
    pref.tagText = el.querySelector('#setTagText').value.trim();
    savePref(); renderAll(); showToast('Brand settings saved.');
  };

  el.querySelector('#saveNumBtn').onclick = ()=>{
    pref.currencySymbol = el.querySelector('#setCurr').value.trim();
    pref.decimals = parseInt(el.querySelector('#setDec').value);
    pref.amountScale = el.querySelector('#setScale').value;
    pref.showComparative = el.querySelector('#setComp').value==='1';
    savePref(); renderAll(); showToast('Number formatting saved.');
  };

  el.querySelector('#saveTxtBtn').onclick = ()=>{
    pref.txtPL = el.querySelector('#txtPL').value.trim();
    pref.txtBS = el.querySelector('#txtBS').value.trim();
    pref.txtCF = el.querySelector('#txtCF').value.trim();
    pref.txtTB = el.querySelector('#txtTB').value.trim();
    savePref(); renderAll(); showToast('Custom texts saved.');
  };
}

renderAll();
</script>
</body>
</html>
